<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#F2F3F1">
<title>CTG Gala · Status</title>
<link rel="icon" href="assets/marsh-mark.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#F2F3F1;--card:#fff;--text:#16181a;--muted:#5d6266;--line:#e3e5e2;--acc:#E9212A;--acc-a:rgba(233,33,42,.08);--ok:#1f7a4a;--ok-a:rgba(31,122,74,.1);--r:20px}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{background:var(--bg);color:var(--text);font-family:'IBM Plex Sans Arabic',system-ui,-apple-system,sans-serif;font-size:16px;line-height:1.6}
.wrap{max-width:860px;margin:0 auto;padding:16px 16px 48px}
header{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:6px 0 18px}
.brand{display:flex;align-items:center;gap:10px;font-weight:700;font-size:14px;color:var(--muted)}
.brand img{width:28px;height:28px}
.lang{display:inline-flex;background:var(--card);border:1px solid var(--line);border-radius:999px;padding:3px}
.lang button{border:0;background:none;font:inherit;font-weight:700;font-size:14px;padding:6px 14px;border-radius:999px;min-height:36px;cursor:pointer;color:var(--muted)}
.lang button[aria-pressed=true]{background:var(--text);color:#fff}
h1{font-size:clamp(24px,5vw,34px);line-height:1.25;font-weight:700}
.sub{color:var(--muted);font-weight:500;margin-top:6px;font-size:15px}
.card{background:var(--card);border-radius:var(--r);padding:18px;margin-top:14px;border:1px solid var(--line)}
h2{font-size:18px;font-weight:700;margin-bottom:12px}
.facts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.fact{background:var(--bg);border-radius:14px;padding:12px}
.fact b{display:block;font-size:20px;font-weight:700}
.fact span{font-size:13px;color:var(--muted);font-weight:600}
.dates{list-style:none;display:grid;gap:8px}
.dates li{display:grid;grid-template-columns:1fr auto;gap:4px 12px;align-items:center;padding:12px;border-radius:14px;background:var(--bg)}
.dates .what{font-weight:700}
.dates .when{font-size:13.5px;color:var(--muted);font-weight:600}
.dates .left{grid-row:1/3;grid-column:2;font-weight:700;font-size:15px;text-align:center;min-width:76px;padding:6px 10px;border-radius:12px;background:var(--card)}
.dates li.past{opacity:.6}
.dates li.next .left{background:var(--acc);color:#fff}
.tag{display:inline-block;font-size:12.5px;font-weight:700;border-radius:8px;padding:2px 8px;border:1px dashed var(--acc);color:var(--acc);background:var(--acc-a);white-space:nowrap}
.tag.ok{border:1px solid transparent;color:var(--ok);background:var(--ok-a)}
.rows{display:grid;gap:8px}
.row{display:grid;grid-template-columns:1fr auto;gap:6px 12px;align-items:start;padding:12px;border-radius:14px;background:var(--bg)}
.row .t{font-weight:700}
.row .d{grid-column:1/-1;font-size:14px;color:var(--muted)}
ol.q{padding-inline-start:22px;display:grid;gap:8px;font-weight:600}
.owner{display:flex;align-items:center;gap:12px}
.av{width:44px;height:44px;border-radius:50%;background:var(--acc);color:#fff;display:grid;place-items:center;font-weight:700;font-size:18px;flex:none}
.reels{display:grid;gap:6px;margin-top:8px}
.reel{display:grid;grid-template-columns:auto 1fr;gap:2px 10px;padding:10px 12px;border-radius:12px;background:var(--bg)}
.reel .n{grid-row:1/3;font-weight:700;font-size:14px;min-width:28px;height:28px;border-radius:8px;background:var(--card);display:grid;place-items:center}
.reel .t{font-weight:600;font-size:14.5px}
.reel .p{font-size:13px;color:var(--muted)}
.sw{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.sw div{border-radius:14px;background:var(--bg);padding:8px;font-size:13.5px;font-weight:600}
.sw i{display:block;height:64px;border-radius:10px;margin-bottom:8px;border:1px solid var(--line)}
.sw code{display:block;font-family:ui-monospace,Menlo,monospace;font-size:13px;color:var(--muted);direction:ltr;text-align:start}
@media(min-width:720px){.sw{grid-template-columns:repeat(5,minmax(0,1fr))}}
.note{font-size:13px;color:var(--muted);margin-top:10px}
footer{margin-top:22px;font-size:13px;color:var(--muted);text-align:center}
@media(min-width:720px){.facts{grid-template-columns:repeat(4,minmax(0,1fr))}.card{padding:22px}}

/* shared notes */
.nb{margin-top:14px;border-top:1px solid var(--line);padding-top:12px}
.nb.inreel{grid-column:1/-1;margin-top:8px;padding-top:8px}
.nbh{display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap}
.nbh .c{font-size:13.5px;font-weight:700;color:var(--muted)}
.btn{font:inherit;font-weight:700;font-size:14px;border-radius:12px;border:1px solid var(--line);background:var(--card);color:var(--text);padding:8px 14px;min-height:40px;cursor:pointer}
.btn.pri{background:var(--text);color:#fff;border-color:var(--text)}
.btn.sm{font-size:13px;padding:5px 10px;min-height:34px;border-radius:10px}
.btn:disabled{opacity:.5;cursor:default}
.lnk{font:inherit;font-size:13px;font-weight:700;background:none;border:0;color:var(--acc);cursor:pointer;padding:6px 0;min-height:32px}
.nts{display:grid;gap:8px;margin-top:10px}
.nt{background:var(--bg);border-radius:14px;padding:10px 12px;font-size:14.5px}
.inreel .nt{background:var(--card)}
.nh{display:flex;flex-wrap:wrap;align-items:center;gap:4px 8px;font-size:13px;color:var(--muted)}
.nh b{color:var(--text);font-size:14px}
.nx{white-space:pre-wrap;overflow-wrap:anywhere;margin-top:4px}
.sg{display:grid;gap:4px;margin-top:6px;font-size:14px}
.sg del{background:rgba(233,33,42,.08);color:#9a1c22;border-radius:8px;padding:4px 8px;white-space:pre-wrap;overflow-wrap:anywhere}
.sg ins{text-decoration:none;background:var(--ok-a);color:var(--ok);border-radius:8px;padding:4px 8px;white-space:pre-wrap;overflow-wrap:anywhere;font-weight:600}
.kids{display:grid;gap:6px;margin-top:8px;padding-inline-start:12px;border-inline-start:2px solid var(--line)}
.kid{font-size:14px}
.cmp{display:grid;gap:10px;margin-top:10px;background:var(--bg);border-radius:14px;padding:12px}
.inreel .cmp{background:var(--card)}
.cmp label{font-size:13px;font-weight:700;color:var(--muted)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{font:inherit;font-size:14px;font-weight:600;border:1px solid var(--line);background:var(--card);border-radius:999px;padding:6px 12px;min-height:36px;cursor:pointer;color:var(--text)}
.chip[aria-pressed=true]{background:var(--text);color:#fff;border-color:var(--text)}
.cmp textarea,.cmp input,.cmp select{font:inherit;font-size:16px;width:100%;border:1px solid var(--line);border-radius:12px;padding:10px;background:#fff;color:var(--text)}
.cmp textarea{min-height:84px;resize:vertical}
.acts{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.msg{font-size:13px;font-weight:600;color:var(--muted)}
.msg.bad{color:var(--acc)}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="brand"><img src="assets/marsh-mark.svg" alt=""><span data-t="brand"></span></div>
    <div class="lang" role="group" aria-label="Language">
      <button type="button" data-lang="ar" aria-pressed="true">عربي</button>
      <button type="button" data-lang="en" aria-pressed="false">English</button>
    </div>
  </header>

  <h1 data-t="title"></h1>
  <p class="sub" data-t="updated"></p>

  <section class="card" id="pagenotes">
    <h2 data-t="pageH"></h2>
    <p class="note" style="margin:0" data-t="pageD"></p>
    <div class="nb" data-sec="page"></div>
  </section>

  <section class="card">
    <h2 data-t="eventH"></h2>
    <div class="facts">
      <div class="fact"><b data-t="f1v"></b><span data-t="f1"></span></div>
      <div class="fact"><b>70–100</b><span data-t="f2"></span></div>
      <div class="fact"><b>10</b><span data-t="f3"></span></div>
      <div class="fact"><b id="gdays">–</b><span data-t="f4"></span></div>
    </div>
    <p class="note" data-t="venue"></p>
    <div class="nb" data-sec="event"></div>
  </section>

  <section class="card">
    <h2 data-t="datesH"></h2>
    <ul class="dates" id="dates"></ul>
    <p class="note" data-t="datesNote"></p>
    <div class="nb" data-sec="dates"></div>
  </section>

  <section class="card">
    <h2 data-t="delH"></h2>
    <div class="rows" id="dels"></div>
    <h2 style="margin-top:18px" data-t="reelsH"></h2>
    <div class="reels" id="reels"></div>
    <p class="note" data-t="delNote"></p>
    <div class="nb" data-sec="dels"></div>
  </section>

  <section class="card">
    <h2 data-t="palH"></h2>
    <div class="sw" id="pal"></div>
    <p class="note" data-t="palNote"></p>
    <div class="nb" data-sec="pal"></div>
  </section>

  <section class="card">
    <h2 data-t="needH"></h2>
    <div class="rows" id="needs"></div>
    <div class="nb" data-sec="needs"></div>
  </section>

  <section class="card">
    <h2 data-t="gotH"></h2>
    <div class="rows" id="got"></div>
    <div class="nb" data-sec="got"></div>
  </section>

  <section class="card">
    <h2 data-t="whoH"></h2>
    <div class="owner"><div class="av">ن</div><div><div class="t" style="font-weight:700" data-t="owner"></div><div class="note" style="margin:0" data-t="ownerRole"></div></div></div>
    <p class="note" data-t="signoff"></p>
    <p class="note" data-t="photo"></p>
    <div class="nb" data-sec="owner"></div>
  </section>

  <section class="card">
    <h2 data-t="openH"></h2>
    <ol class="q" id="open"></ol>
    <div class="nb" data-sec="open"></div>
  </section>

  <footer data-t="foot"></footer>
</div>
<script>
const T = {
  brand: ['مارش للتسويق والتطوير', 'Marsh Marketing and Development'],
  title: ['حفل الذكرى العشرين لـ CTG · الحالة', 'CTG 20th Anniversary Gala · Status'],
  updated: ['آخر تحديث: 24 تشرين الأول 2026', 'Last updated: 24 October 2026'],
  eventH: ['الحفل', 'The gala'],
  f1v: ['5 تشرين الثاني', '5 Nov'], f1: ['موعد الحفل 2026', 'Gala date, 2026'],
  f2: ['ضيف', 'Guests'], f3: ['فيديوهات', 'Videos'], f4: ['يوماً للحفل', 'Days to the gala'],
  venue: ['المكان: قاعة Delegata Diamond Conference. المصدر: إجابات مريم، 21 تشرين الأول.', 'Venue: Delegata Diamond Conference room. Source: Mariem\'s answers, 21 October.'],
  datesH: ['المواعيد', 'Dates'],
  datesNote: ['العدّ بالأيام حسب تاريخ جهازك.', 'Days are counted from the date on your device.'],
  delH: ['المطلوب', 'Deliverables'],
  delNote: ['المصدر: خطة محتوى الفيديو من CTG (21 تشرين الأول). صافي، 23 تشرين الأول: المطلوب موجود في مجموعة «Mariem Global & Marsh».', 'Source: CTG video content strategy (21 October). Safi, 23 October: the requirements are in the group "Mariem Global & Marsh".'],
  reelsH: ['الريلز الثمانية', 'The 8 reels'],
  palH: ['ألوان الحفل', 'Gala colours'],
  palNote: ['المصدر: محاضر اجتماع 16 تشرين الأول، الصفحة الأخيرة. الرموز كما كُتبت في الملف.', 'Source: notes of the 16 October meeting, last page. Codes as written in the file.'],
  photo: ['المصوّر: يُحدَّد قبل الحفل بأسبوع (صافي، 23 تشرين الأول).', 'Photographer: set one week before the event (Safi, 23 October).'],
  needH: ['المطلوب من مريم وآية', 'Needed from Mariem and Aya'],
  gotH: ['ما وصلنا', 'Received'],
  whoH: ['المسؤول', 'Owner'],
  owner: ['نور', 'Nour'],
  ownerRole: ['مديرة المشروع في مارش', 'Project manager at Marsh'],
  signoff: ['الموافقة النهائية: مريم وآية.', 'Final sign-off: Mariem and Aya.'],
  openH: ['للتأكيد', 'To confirm'],
  foot: ['هذه الصفحة للمتابعة الداخلية. كل بند «للتأكيد» ينتظر جواباً.', 'This page is for tracking. Each item marked "To confirm" waits for an answer.'],
  tbd: ['للتأكيد', 'To confirm'], ok: ['وصل', 'Received'],
  pageH: ['ملاحظات على الصفحة كلها', 'Notes on the whole page'],
  pageD: ['تحت كل قسم مكان للملاحظات والتعديلات. كل من معه الرابط يراها، ومارش تستلمها. الوقت بتوقيت الأردن.', 'Each section has a box for notes and edits. Everyone with the link sees them, and Marsh gets them. Times are Jordan time.'],
  past: ['مضى', 'Passed'], today: ['اليوم', 'Today'], day: ['يوم', 'day'], days: ['أيام', 'days'],
};
const DATES = [
  ['2026-10-20', '2026-10-24', ['التصوير', 'Filming'], ['20–24 تشرين الأول', '20–24 October']],
  ['2026-10-22', null, ['الإحصاءات والصور من CTG', 'Stats and photos from CTG'], ['طُلبت قبل 22 تشرين الأول', 'Asked for by 22 October']],
  ['2026-10-25', '2026-10-28', ['المسودة الأولى للمونتاج', 'Rough cut'], ['25–28 تشرين الأول', '25–28 October']],
  ['2026-10-29', null, ['موافقة نسخة الحفل وتثبيتها', 'Gala cut approved and locked'], ['29 تشرين الأول', '29 October']],
  ['2026-10-29', null, ['تحديد المصوّر', 'Photographer set'], ['أسبوع قبل الحفل', 'One week before the gala']],
  ['2026-11-03', null, ['كل الملفات النهائية', 'All final assets'], ['3 تشرين الثاني', '3 November']],
  ['2026-11-05', null, ['الحفل', 'The gala'], ['5 تشرين الثاني', '5 November']],
];
const DELS = [
  [['الفيلم الوثائقي الرئيسي · 1', 'Master documentary · 1'], ['10–15 دقيقة. موقع CTG، يوتيوب، المتبرعون. الموعد: 3 تشرين الثاني («كل الملفات النهائية»).', '10–15 min. CTG website, YouTube, donor outreach. Due: 3 November ("all assets finalized").'], ['3 تشرين الثاني', '3 Nov']],
  [['نسخة الحفل · 1', 'Gala cut · 1'], ['5–7 دقائق، تُعرض يوم الحفل. المسودة 25–28 تشرين الأول، التثبيت 29 تشرين الأول.', '5–7 min, shown at the gala. Rough cut 25–28 October, locked 29 October.'], ['29 تشرين الأول', '29 Oct']],
  [['ريلز · 8', 'Reels · 8'], ['60–90 ثانية لكل ريل. ريل واحد كل أسبوع. القائمة تحت.', '60–90 s each. One reel a week. List below.'], null],
  [['صور فوتوغرافية', 'Still photos'], ['لكل منظمة، تُلتقط أثناء التصوير. للموقع والصحافة والمطبوعات.', 'Per organization, taken during filming. For the website, press and print.'], null],
];
const REELS = [
  [['قصة البداية: أول منحة', 'Founder origin story: the first stipend'], 'LinkedIn, Facebook'],
  [['IYT: قصة تحوّل طالب', 'IYT: student transformation story'], 'Instagram, YouTube Shorts'],
  [['Keep Going Sis: مضاعفة الوصول في السنة الثانية', 'Keep Going Sis: doubling reach in year two'], 'Instagram, TikTok'],
  [['Miracle University: خرّيج وُصف بأنه منقطع عن الدراسة', 'Miracle University: graduate who was labeled a dropout'], 'Instagram, YouTube Shorts'],
  [['NorCal Pharaohs: قصة طالب رياضي', 'NorCal Pharaohs: student athlete story'], 'Instagram, Facebook'],
  [['Sac PD Foundation: متدرّب أصبح طالباً جامعياً', 'Sac PD Foundation: cadet who became a college student'], 'LinkedIn, Facebook'],
  [['عضو مجلس: 20 سنة من القيادة التطوعية', 'Board member reflection: 20 years of volunteer leadership'], 'LinkedIn'],
  [['أثر CTG بالأرقام: ريل موشن جرافيك', 'CTG impact by the numbers: motion graphic reel'], ['كل المنصات', 'All platforms']],
];
const PAL = [
  ['Deep Teal', '#006B58'], ['Logo Teal', '#28A08C'], ['Logo Green', '#50B43C'], ['Charcoal', '#1A1A1A'], ['Off White', '#F9FBF9'],
];
const NEEDS = [
  [['مكان مواد تصوير 20–24 تشرين الأول', 'Where the 20–24 October footage is'], ['رابط واحد لكل الملفات الخام.', 'One link to all the raw files.']],
  [['الإحصاءات والصور', 'Stats and photos'], ['الأرقام بعد التحقق منها، كما في محاضر الاجتماع.', 'The figures after they are checked, as the meeting notes say.']],
];
const GOT = [
  [['إجابات الأسئلة (21 سؤالاً)', 'Answers to the 21 questions'], ['21 تشرين الأول', '21 October']],
  [['خطة محتوى الفيديو من CTG (PDF)', 'CTG video content strategy (PDF)'], ['21 تشرين الأول', '21 October']],
  [['محاضر اجتماع 16 تشرين الأول ولوحة الألوان (PDF)', 'Notes of the 16 October meeting, with the colour palette (PDF)'], ['21 تشرين الأول', '21 October']],
  [['جواب صافي: المطلوب والمصوّر', 'Safi\'s answer: requirements and photographer'], ['23 تشرين الأول', '23 October']],
];
const OPEN = [
  ['مدة نسخة الحفل: الخطة تقول 5–7 دقائق، ومحاضر 16 تشرين الأول تقول 7–10 دقائق.', 'Gala cut length: the strategy says 5–7 min; the 16 October notes say 7–10 min.'],
  ['بداية الريلز الأسبوعية: الخطة تذكر 20 تشرين الأول في قسم الريلز، و6 تشرين الثاني في الجدول الزمني.', 'Weekly reels start: the strategy says 20 October in the reels section and 6 November in the timeline.'],
  ['موعد تسليم الوثائقي الرئيسي: الخطة لا تذكر موعداً خاصاً به، فقط «كل الملفات النهائية» في 3 تشرين الثاني.', 'Master documentary due date: the strategy gives no date for it, only "all assets finalized" on 3 November.'],
  ['موعد تسليم الصور الفوتوغرافية.', 'Due date for the still photos.'],
  ['اسم المصوّر ورقمه: يُحدَّد قبل الحفل بأسبوع.', 'Photographer name and number: set one week before the event.'],
];
let L = 'ar';
try { const s = localStorage.getItem('ctg-lang'); if (s === 'en' || s === 'ar') L = s; } catch (e) {}
const i = () => (L === 'ar' ? 0 : 1);
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const day0 = (d) => { const x = new Date(d + 'T00:00:00'); return x; };
function today() { const n = new Date(); return new Date(n.getFullYear(), n.getMonth(), n.getDate()); }
function diff(d) { return Math.round((day0(d) - today()) / 86400000); }
function leftTxt(start, end) {
  const a = diff(start), b = end ? diff(end) : a;
  if (b < 0) return T.past[i()];
  if (a <= 0) return T.today[i()];
  if (L === 'ar') return a + ' ' + (a === 1 ? 'يوم' : a <= 10 ? 'أيام' : 'يوماً');
  return a + ' ' + (a === 1 ? T.day[i()] : T.days[i()]);
}
function render() {
  document.documentElement.lang = L; document.documentElement.dir = L === 'ar' ? 'rtl' : 'ltr';
  document.querySelectorAll('[data-t]').forEach((el) => { el.textContent = T[el.dataset.t][i()]; });
  document.querySelectorAll('.lang button').forEach((b) => b.setAttribute('aria-pressed', String(b.dataset.lang === L)));
  const g = diff('2026-11-05'); document.getElementById('gdays').textContent = g >= 0 ? g : '0';
  let nextMarked = false;
  document.getElementById('dates').innerHTML = DATES.map(([s, e, w, d]) => {
    const past = (e ? diff(e) : diff(s)) < 0; let cls = past ? 'past' : '';
    if (!past && !nextMarked) { cls = 'next'; nextMarked = true; }
    return `<li class="${cls}"><span class="what">${esc(w[i()])}</span><span class="left">${esc(leftTxt(s, e))}</span><span class="when">${esc(d[i()])}</span></li>`;
  }).join('');
  document.getElementById('dels').innerHTML = DELS.map(([t, d, due]) => `<div class="row"><span class="t">${esc(t[i()])}</span><span class="tag${due ? ' ok' : ''}">${esc(due ? due[i()] : T.tbd[i()])}</span><span class="d">${esc(d[i()])}</span></div>`).join('');
  document.getElementById('reels').innerHTML = REELS.map(([t, p], k) => `<div class="reel"><span class="n">${k + 1}</span><span class="t">${esc(t[i()])}</span><span class="p" dir="ltr" style="text-align:start">${esc(Array.isArray(p) ? p[i()] : p)}</span><div class="nb inreel" data-sec="reel-${k + 1}"></div></div>`).join('');
  document.getElementById('pal').innerHTML = PAL.map(([n, h]) => `<div><i style="background:${h}"></i>${esc(n)}<code>${esc(h)}</code></div>`).join('');
  document.getElementById('needs').innerHTML = NEEDS.map(([t, d]) => `<div class="row"><span class="t">${esc(t[i()])}</span><span class="tag">${esc(T.tbd[i()])}</span><span class="d">${esc(d[i()])}</span></div>`).join('');
  document.getElementById('got').innerHTML = GOT.map(([t, d]) => `<div class="row"><span class="t">${esc(t[i()])}</span><span class="tag ok">${esc(T.ok[i()])}</span><span class="d">${esc(d[i()])}</span></div>`).join('');
  document.getElementById('open').innerHTML = OPEN.map((q) => `<li>${esc(q[i()])}</li>`).join('');
  document.title = L === 'ar' ? 'حفل CTG · الحالة' : 'CTG Gala · Status';
  renderNotes();
}
document.querySelectorAll('.lang button').forEach((b) => b.addEventListener('click', () => {
  L = b.dataset.lang; try { localStorage.setItem('ctg-lang', L); } catch (e) {} render();
}));

// ---- shared notes (site 'ctg' on the site-feedback function) ----
const FN = 'https://jwvgyktutbeszguevqoy.supabase.co/functions/v1/site-feedback';
const NAMES = ['Safi', 'Mariem', 'Aya', 'Nour'];
const N = {
  notes: ['ملاحظات', 'Notes'], add: ['أضف ملاحظة', 'Add a note'], kNote: ['ملاحظة', 'Note'], kSug: ['تعديل مقترح', 'Suggested edit'],
  name: ['اسمك', 'Your name'], other: ['اسم آخر', 'Other'], otherPh: ['اكتب اسمك', 'Type your name'], text: ['الملاحظة', 'Note'],
  why: ['ملاحظة (اختياري)', 'Note (optional)'], line: ['أي سطر؟', 'Which line?'], lineOther: ['سطر آخر (الصق النص الحالي)', 'Another line (paste the current text)'],
  oldPh: ['النص الحالي', 'Current text'], newL: ['النص الجديد', 'New text'], send: ['إرسال', 'Send'], cancel: ['إلغاء', 'Cancel'], reply: ['رد', 'Reply'],
  replyPh: ['اكتب ردك', 'Write a reply'], sending: ['جارٍ الإرسال…', 'Sending…'], sent: ['وصلت. يراها الجميع.', 'Saved. Everyone sees it.'],
  err: ['لم تُحفظ. حاول مرة أخرى.', 'Not saved. Try again.'], needName: ['اختر اسمك أولاً.', 'Pick your name first.'], needText: ['اكتب شيئاً أولاً.', 'Write something first.'],
  loadErr: ['تعذّر تحميل الملاحظات. أعد فتح الصفحة.', 'Could not load the notes. Reload the page.'], loading: ['تحميل الملاحظات…', 'Loading notes…'],
  more: ['عرض الكل', 'Show all'], less: ['عرض أقل', 'Show less'], applied: ['طُبّق', 'Applied'], sugg: ['تعديل مقترح', 'Suggested edit'],
  marsh: ['مارش', 'Marsh'], none: ['لا ملاحظات بعد.', 'No notes yet.'],
};
const n = (k) => N[k][i()];
const SEC = {
  page: [() => [T.title[i()], T.updated[i()], T.foot[i()]], ['الصفحة كلها', 'Whole page']],
  event: [() => [T.f1v[i()] + ' · ' + T.f1[i()], '70–100 · ' + T.f2[i()], '10 · ' + T.f3[i()], T.venue[i()]], T.eventH],
  dates: [() => DATES.map(([, , w, d]) => w[i()] + ' · ' + d[i()]), T.datesH],
  dels: [() => DELS.flatMap(([t, d]) => [t[i()], d[i()]]).concat(T.delNote[i()]), T.delH],
  pal: [() => PAL.map(([nm, h]) => nm + ' ' + h), T.palH],
  needs: [() => NEEDS.flatMap(([t, d]) => [t[i()], d[i()]]), T.needH],
  got: [() => GOT.map(([t, d]) => t[i()] + ' · ' + d[i()]), T.gotH],
  owner: [() => [T.owner[i()] + ' · ' + T.ownerRole[i()], T.signoff[i()], T.photo[i()]], T.whoH],
  open: [() => OPEN.map((q) => q[i()]), T.openH],
};
REELS.forEach(([t, p], k) => { SEC['reel-' + (k + 1)] = [() => [t[i()], Array.isArray(p) ? p[i()] : p], [`ريل ${k + 1}`, `Reel ${k + 1}`]]; });
const secLabel = (sec, lang) => SEC[sec][1][lang];
let NOTES = [], NSTATE = 'loading', ME = '';
try { ME = localStorage.getItem('ctg-name') || ''; } catch (e) {}
const UI = { open: {}, kind: {}, all: {}, exp: {}, reply: null, busy: {}, msg: {} };
const DRAFT = {};
const AMMAN = () => new Intl.DateTimeFormat(L === 'ar' ? 'ar-JO-u-nu-latn' : 'en-GB', { timeZone: 'Asia/Amman', day: 'numeric', month: 'short', hour: '2-digit', minute: '2-digit', hour12: false });
const when = (iso) => { try { return AMMAN().format(new Date(iso)); } catch (e) { return ''; } };
function snapshot() {
  document.querySelectorAll('[data-d]').forEach((el) => { DRAFT[el.dataset.d] = el.value; });
  const a = document.activeElement;
  return a && a.dataset && a.dataset.d ? { d: a.dataset.d, s: a.selectionStart, e: a.selectionEnd } : null;
}
function restore(f) {
  document.querySelectorAll('[data-d]').forEach((el) => { if (DRAFT[el.dataset.d] != null) el.value = DRAFT[el.dataset.d]; });
  if (f) { const el = document.querySelector(`[data-d="${f.d}"]`); if (el) { el.focus({ preventScroll: true }); try { el.setSelectionRange(f.s, f.e); } catch (e) {} } }
}
function nameChips(key) {
  const other = ME && !NAMES.includes(ME);
  const pick = UI['nm' + key] ?? (other ? '__o' : ME);
  return `<label>${n('name')}</label><div class="chips">${NAMES.map((x) => `<button type="button" class="chip" data-act="nm" data-k="${key}" data-v="${x}" aria-pressed="${pick === x}">${x}</button>`).join('')}<button type="button" class="chip" data-act="nm" data-k="${key}" data-v="__o" aria-pressed="${pick === '__o'}">${n('other')}</button></div>${pick === '__o' ? `<input data-d="${key}:name" maxlength="60" placeholder="${esc(n('otherPh'))}" value="${other ? esc(ME) : ''}">` : ''}`;
}
function composer(sec) {
  const k = UI.kind[sec] || 'note', lines = SEC[sec][0]();
  const sel = DRAFT[sec + ':line'] ?? '0';
  return `<div class="cmp">${nameChips(sec)}
    <div class="chips"><button type="button" class="chip" data-act="kind" data-k="${sec}" data-v="note" aria-pressed="${k === 'note'}">${n('kNote')}</button><button type="button" class="chip" data-act="kind" data-k="${sec}" data-v="suggest" aria-pressed="${k === 'suggest'}">${n('kSug')}</button></div>
    ${k === 'suggest' ? `<label>${n('line')}</label><select data-d="${sec}:line" data-act="line" data-k="${sec}">${lines.map((x, j) => `<option value="${j}"${String(j) === sel ? ' selected' : ''}>${esc(x.length > 90 ? x.slice(0, 90) + '…' : x)}</option>`).join('')}<option value="o"${sel === 'o' ? ' selected' : ''}>${n('lineOther')}</option></select>
    ${sel === 'o' ? `<textarea data-d="${sec}:old" maxlength="2000" dir="auto" placeholder="${esc(n('oldPh'))}"></textarea>` : ''}
    <label>${n('newL')}</label><textarea data-d="${sec}:new" maxlength="2000" dir="auto"></textarea><label>${n('why')}</label><textarea data-d="${sec}:text" maxlength="2000" dir="auto" style="min-height:56px"></textarea>`
    : `<label>${n('text')}</label><textarea data-d="${sec}:text" maxlength="2000" dir="auto"></textarea>`}
    <div class="acts"><button type="button" class="btn pri" data-act="send" data-k="${sec}"${UI.busy[sec] ? ' disabled' : ''}>${UI.busy[sec] ? n('sending') : n('send')}</button><button type="button" class="btn" data-act="close" data-k="${sec}">${n('cancel')}</button>${msgHtml(sec)}</div></div>`;
}
function msgHtml(key) { const m = UI.msg[key]; return m ? `<span class="msg${m[1] ? ' bad' : ''}" role="status">${esc(n(m[0]))}</span>` : ''; }
function noteHtml(x) {
  const kids = NOTES.filter((y) => y.parent === x.id).sort((a, b) => a.at.localeCompare(b.at));
  const tag = x.kind === 'suggest' ? `<span class="tag">${n('sugg')}</span>` : '';
  const done = x.status === 'applied' ? `<span class="tag ok">${n('applied')}</span>` : '';
  const sug = x.kind === 'suggest' ? `<div class="sg">${x.old ? `<del dir="auto">${esc(x.old)}</del>` : ''}<ins dir="auto">${esc(x.new)}</ins></div>` : '';
  const rk = 'r' + x.id;
  const rbox = UI.reply === x.id ? `<div class="cmp">${nameChips(rk)}<textarea data-d="${rk}:text" maxlength="2000" dir="auto" placeholder="${esc(n('replyPh'))}"></textarea><div class="acts"><button type="button" class="btn pri sm" data-act="sendr" data-k="${x.id}"${UI.busy[rk] ? ' disabled' : ''}>${UI.busy[rk] ? n('sending') : n('send')}</button><button type="button" class="btn sm" data-act="closer">${n('cancel')}</button>${msgHtml(rk)}</div></div>` : '';
  const marsh = x.reply ? `<div class="kid"><div class="nh"><b>${n('marsh')}</b></div><div class="nx" dir="auto">${esc(x.reply)}</div></div>` : '';
  const kidsH = kids.map((y) => `<div class="kid"><div class="nh"><b dir="auto">${esc(y.author)}</b><span>${esc(when(y.at))}</span></div><div class="nx" dir="auto">${esc(y.text)}</div></div>`).join('');
  return `<div class="nt"><div class="nh"><b dir="auto">${esc(x.author)}</b><span>${esc(when(x.at))}</span>${tag}${done}</div>${sug}${x.text ? `<div class="nx" dir="auto">${esc(x.text)}</div>` : ''}${marsh || kidsH ? `<div class="kids">${marsh}${kidsH}</div>` : ''}${rbox}${UI.reply === x.id ? '' : `<button type="button" class="lnk" data-act="reply" data-k="${x.id}">${n('reply')}</button>`}</div>`;
}
function box(sec) {
  const top = NOTES.filter((x) => x.section === sec && !x.parent).sort((a, b) => b.at.localeCompare(a.at));
  const reel = sec.startsWith('reel-');
  if (reel && !UI.exp[sec]) return `<div class="nbh"><button type="button" class="lnk" data-act="exp" data-k="${sec}">${top.length ? `${n('notes')} (${top.length})` : n('add')}</button></div>`;
  const lim = UI.all[sec] ? top.length : 3;
  const head = `<div class="nbh"><span class="c">${n('notes')}${top.length ? ` · ${top.length}` : ''}</span>${UI.open[sec] ? '' : `<button type="button" class="btn sm" data-act="open" data-k="${sec}">${n('add')}</button>`}</div>`;
  const state = NSTATE === 'loading' ? `<p class="msg">${n('loading')}</p>` : NSTATE === 'fail' ? `<p class="msg bad">${n('loadErr')}</p>` : '';
  const list = top.length ? `<div class="nts">${top.slice(0, lim).map(noteHtml).join('')}</div>` : '';
  const more = top.length > 3 ? `<button type="button" class="lnk" data-act="all" data-k="${sec}">${UI.all[sec] ? n('less') : `${n('more')} (${top.length})`}</button>` : '';
  return head + state + list + more + (UI.open[sec] ? composer(sec) : '') + (UI.msg[sec] && !UI.open[sec] ? `<p>${msgHtml(sec)}</p>` : '');
}
function renderNotes() {
  const f = snapshot();
  document.querySelectorAll('.nb[data-sec]').forEach((el) => { if (SEC[el.dataset.sec]) el.innerHTML = box(el.dataset.sec); });
  restore(f);
}
async function loadNotes() {
  try {
    const r = await fetch(FN + '?site=ctg', { cache: 'no-store' });
    const j = await r.json();
    if (!r.ok || !j.ok || !Array.isArray(j.notes)) throw new Error('bad');
    NOTES = j.notes.map((x) => ({ id: Number(x.id), at: String(x.at || ''), section: String(x.section || ''), author: String(x.author || ''), text: String(x.text || ''),
      kind: String(x.kind || 'note'), parent: x.parent == null ? null : Number(x.parent), old: String(x.old || ''), new: String(x.new || ''), status: String(x.status || 'open'), reply: String(x.reply || '') }));
    NSTATE = 'ok';
  } catch (e) { if (NSTATE !== 'ok') NSTATE = 'fail'; }
  renderNotes();
}
function author(key) {
  const pick = UI['nm' + key] ?? (ME && !NAMES.includes(ME) ? '__o' : ME);
  if (pick === '__o') return (DRAFT[key + ':name'] || '').trim().slice(0, 60);
  return pick || '';
}
async function post(key, body) {
  UI.busy[key] = true; UI.msg[key] = null; renderNotes();
  try {
    const r = await fetch(FN, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) });
    const j = await r.json().catch(() => ({}));
    if (!r.ok || !j.ok) throw new Error(j.error || 'failed');
    ME = body.author; try { localStorage.setItem('ctg-name', ME); } catch (e) {}
    UI.busy[key] = false; return true;
  } catch (e) { UI.busy[key] = false; UI.msg[key] = ['err', 1]; renderNotes(); return false; }
}
document.addEventListener('change', (e) => { const t = e.target; if (t.dataset && t.dataset.act === 'line') { DRAFT[t.dataset.d] = t.value; renderNotes(); } });
document.addEventListener('click', async (e) => {
  const b = e.target.closest('[data-act]'); if (!b || b.tagName === 'SELECT') return;
  const k = b.dataset.k, a = b.dataset.act;
  snapshot();
  if (a === 'open') { UI.open[k] = true; UI.msg[k] = null; }
  else if (a === 'close') { UI.open[k] = false; }
  else if (a === 'exp') { UI.exp[k] = true; UI.open[k] = true; }
  else if (a === 'all') { UI.all[k] = !UI.all[k]; }
  else if (a === 'kind') { UI.kind[k] = b.dataset.v; }
  else if (a === 'nm') { UI['nm' + k] = b.dataset.v; }
  else if (a === 'reply') { UI.reply = Number(k); }
  else if (a === 'closer') { UI.reply = null; }
  else if (a === 'send') {
    const kind = UI.kind[k] || 'note', who = author(k), text = (DRAFT[k + ':text'] || '').trim(), nw = (DRAFT[k + ':new'] || '').trim();
    if (!who) { UI.msg[k] = ['needName', 1]; renderNotes(); return; }
    if (kind === 'suggest' ? !nw : !text) { UI.msg[k] = ['needText', 1]; renderNotes(); return; }
    let old = '';
    if (kind === 'suggest') { const sel = DRAFT[k + ':line'] ?? '0'; old = sel === 'o' ? (DRAFT[k + ':old'] || '').trim() : (SEC[k][0]()[Number(sel)] || ''); }
    const ok = await post(k, { site: 'ctg', page: 'ctg', section: k, label: secLabel(k, 1), author: who, lang: L, comment: text, fields: kind === 'suggest' ? { kind, old, new: nw } : { kind } });
    if (ok) { document.querySelectorAll(`[data-d^="${k}:"]`).forEach((el) => el.remove()); ['text', 'new', 'old', 'line'].forEach((f) => { delete DRAFT[k + ':' + f]; }); UI.open[k] = false; UI.kind[k] = 'note'; UI.msg[k] = ['sent', 0]; await loadNotes(); }
    return;
  } else if (a === 'sendr') {
    const id = Number(k), rk = 'r' + id, who = author(rk), text = (DRAFT[rk + ':text'] || '').trim(), par = NOTES.find((x) => x.id === id);
    if (!par) return;
    if (!who) { UI.msg[rk] = ['needName', 1]; renderNotes(); return; }
    if (!text) { UI.msg[rk] = ['needText', 1]; renderNotes(); return; }
    const ok = await post(rk, { site: 'ctg', page: 'ctg', section: par.section, label: secLabel(par.section, 1), author: who, lang: L, comment: text, fields: { kind: 'reply', parent: id } });
    if (ok) { document.querySelectorAll(`[data-d^="${rk}:"]`).forEach((el) => el.remove()); delete DRAFT[rk + ':text']; UI.reply = null; await loadNotes(); }
    return;
  } else return;
  renderNotes();
});
render();
loadNotes();
setInterval(() => { if (!document.hidden) loadNotes(); }, 60000);
document.addEventListener('visibilitychange', () => { if (!document.hidden) loadNotes(); });
</script>
