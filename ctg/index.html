<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#F2F3F1">
<title>CTG Gala · Status</title>
<link rel="icon" href="assets/marsh-mark.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#F2F3F1;--card:#fff;--text:#16181a;--muted:#5d6266;--line:#e3e5e2;--acc:#E9212A;--acc-a:rgba(233,33,42,.08);--ok:#1f7a4a;--ok-a:rgba(31,122,74,.1);--r:20px}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{background:var(--bg);color:var(--text);font-family:'IBM Plex Sans Arabic',system-ui,-apple-system,sans-serif;font-size:16px;line-height:1.6}
.wrap{max-width:860px;margin:0 auto;padding:16px 16px 48px}
header{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:6px 0 18px}
.brand{display:flex;align-items:center;gap:10px;font-weight:700;font-size:14px;color:var(--muted)}
.brand img{width:28px;height:28px}
.lang{display:inline-flex;background:var(--card);border:1px solid var(--line);border-radius:999px;padding:3px}
.lang button{border:0;background:none;font:inherit;font-weight:700;font-size:14px;padding:6px 14px;border-radius:999px;min-height:36px;cursor:pointer;color:var(--muted)}
.lang button[aria-pressed=true]{background:var(--text);color:#fff}
h1{font-size:clamp(24px,5vw,34px);line-height:1.25;font-weight:700}
.sub{color:var(--muted);font-weight:500;margin-top:6px;font-size:15px}
.card{background:var(--card);border-radius:var(--r);padding:18px;margin-top:14px;border:1px solid var(--line)}
h2{font-size:18px;font-weight:700;margin-bottom:12px}
.facts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.fact{background:var(--bg);border-radius:14px;padding:12px}
.fact b{display:block;font-size:20px;font-weight:700}
.fact span{font-size:13px;color:var(--muted);font-weight:600}
.dates{list-style:none;display:grid;gap:8px}
.dates li{display:grid;grid-template-columns:1fr auto;gap:4px 12px;align-items:center;padding:12px;border-radius:14px;background:var(--bg)}
.dates .what{font-weight:700}
.dates .when{font-size:13.5px;color:var(--muted);font-weight:600}
.dates .left{grid-row:1/3;grid-column:2;font-weight:700;font-size:15px;text-align:center;min-width:76px;padding:6px 10px;border-radius:12px;background:var(--card)}
.dates li.past{opacity:.6}
.dates li.next .left{background:var(--acc);color:#fff}
.tag{display:inline-block;font-size:12.5px;font-weight:700;border-radius:8px;padding:2px 8px;border:1px dashed var(--acc);color:var(--acc);background:var(--acc-a);white-space:nowrap}
.tag.ok{border:1px solid transparent;color:var(--ok);background:var(--ok-a)}
.rows{display:grid;gap:8px}
.row{display:grid;grid-template-columns:1fr auto;gap:6px 12px;align-items:start;padding:12px;border-radius:14px;background:var(--bg)}
.row .t{font-weight:700}
.row .d{grid-column:1/-1;font-size:14px;color:var(--muted)}
ol.q{padding-inline-start:22px;display:grid;gap:8px;font-weight:600}
.owner{display:flex;align-items:center;gap:12px}
.av{width:44px;height:44px;border-radius:50%;background:var(--acc);color:#fff;display:grid;place-items:center;font-weight:700;font-size:18px;flex:none}
.reels{display:grid;gap:6px;margin-top:8px}
.reel{display:grid;grid-template-columns:auto 1fr;gap:2px 10px;padding:10px 12px;border-radius:12px;background:var(--bg)}
.reel .n{grid-row:1/3;font-weight:700;font-size:14px;min-width:28px;height:28px;border-radius:8px;background:var(--card);display:grid;place-items:center}
.reel .t{font-weight:600;font-size:14.5px}
.reel .p{font-size:13px;color:var(--muted)}
.sw{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.sw div{border-radius:14px;background:var(--bg);padding:8px;font-size:13.5px;font-weight:600}
.sw i{display:block;height:64px;border-radius:10px;margin-bottom:8px;border:1px solid var(--line)}
.sw code{display:block;font-family:ui-monospace,Menlo,monospace;font-size:13px;color:var(--muted);direction:ltr;text-align:start}
@media(min-width:720px){.sw{grid-template-columns:repeat(5,minmax(0,1fr))}}
.note{font-size:13px;color:var(--muted);margin-top:10px}
footer{margin-top:22px;font-size:13px;color:var(--muted);text-align:center}
@media(min-width:720px){.facts{grid-template-columns:repeat(4,minmax(0,1fr))}.card{padding:22px}}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="brand"><img src="assets/marsh-mark.svg" alt=""><span data-t="brand"></span></div>
    <div class="lang" role="group" aria-label="Language">
      <button type="button" data-lang="ar" aria-pressed="true">عربي</button>
      <button type="button" data-lang="en" aria-pressed="false">English</button>
    </div>
  </header>

  <h1 data-t="title"></h1>
  <p class="sub" data-t="updated"></p>

  <section class="card">
    <h2 data-t="eventH"></h2>
    <div class="facts">
      <div class="fact"><b data-t="f1v"></b><span data-t="f1"></span></div>
      <div class="fact"><b>70–100</b><span data-t="f2"></span></div>
      <div class="fact"><b>10</b><span data-t="f3"></span></div>
      <div class="fact"><b id="gdays">–</b><span data-t="f4"></span></div>
    </div>
    <p class="note" data-t="venue"></p>
  </section>

  <section class="card">
    <h2 data-t="datesH"></h2>
    <ul class="dates" id="dates"></ul>
    <p class="note" data-t="datesNote"></p>
  </section>

  <section class="card">
    <h2 data-t="delH"></h2>
    <div class="rows" id="dels"></div>
    <h2 style="margin-top:18px" data-t="reelsH"></h2>
    <div class="reels" id="reels"></div>
    <p class="note" data-t="delNote"></p>
  </section>

  <section class="card">
    <h2 data-t="palH"></h2>
    <div class="sw" id="pal"></div>
    <p class="note" data-t="palNote"></p>
  </section>

  <section class="card">
    <h2 data-t="needH"></h2>
    <div class="rows" id="needs"></div>
  </section>

  <section class="card">
    <h2 data-t="gotH"></h2>
    <div class="rows" id="got"></div>
  </section>

  <section class="card">
    <h2 data-t="whoH"></h2>
    <div class="owner"><div class="av">ن</div><div><div class="t" style="font-weight:700" data-t="owner"></div><div class="note" style="margin:0" data-t="ownerRole"></div></div></div>
    <p class="note" data-t="signoff"></p>
    <p class="note" data-t="photo"></p>
  </section>

  <section class="card">
    <h2 data-t="openH"></h2>
    <ol class="q" id="open"></ol>
  </section>

  <footer data-t="foot"></footer>
</div>
<script>
const T = {
  brand: ['مارش للتسويق والتطوير', 'Marsh Marketing and Development'],
  title: ['حفل الذكرى العشرين لـ CTG · الحالة', 'CTG 20th Anniversary Gala · Status'],
  updated: ['آخر تحديث: 24 تشرين الأول 2026', 'Last updated: 24 October 2026'],
  eventH: ['الحفل', 'The gala'],
  f1v: ['5 تشرين الثاني', '5 Nov'], f1: ['موعد الحفل 2026', 'Gala date, 2026'],
  f2: ['ضيف', 'Guests'], f3: ['فيديوهات', 'Videos'], f4: ['يوماً للحفل', 'Days to the gala'],
  venue: ['المكان: قاعة Delegata Diamond Conference. المصدر: إجابات مريم، 21 تشرين الأول.', 'Venue: Delegata Diamond Conference room. Source: Mariem\'s answers, 21 October.'],
  datesH: ['المواعيد', 'Dates'],
  datesNote: ['العدّ بالأيام حسب تاريخ جهازك.', 'Days are counted from the date on your device.'],
  delH: ['المطلوب', 'Deliverables'],
  delNote: ['المصدر: خطة محتوى الفيديو من CTG (21 تشرين الأول). صافي، 23 تشرين الأول: المطلوب موجود في مجموعة «Mariem Global & Marsh».', 'Source: CTG video content strategy (21 October). Safi, 23 October: the requirements are in the group "Mariem Global & Marsh".'],
  reelsH: ['الريلز الثمانية', 'The 8 reels'],
  palH: ['ألوان الحفل', 'Gala colours'],
  palNote: ['المصدر: محاضر اجتماع 16 تشرين الأول، الصفحة الأخيرة. الرموز كما كُتبت في الملف.', 'Source: notes of the 16 October meeting, last page. Codes as written in the file.'],
  photo: ['المصوّر: يُحدَّد قبل الحفل بأسبوع (صافي، 23 تشرين الأول).', 'Photographer: set one week before the event (Safi, 23 October).'],
  needH: ['المطلوب من مريم وآية', 'Needed from Mariem and Aya'],
  gotH: ['ما وصلنا', 'Received'],
  whoH: ['المسؤول', 'Owner'],
  owner: ['نور', 'Nour'],
  ownerRole: ['مديرة المشروع في مارش', 'Project manager at Marsh'],
  signoff: ['الموافقة النهائية: مريم وآية.', 'Final sign-off: Mariem and Aya.'],
  openH: ['للتأكيد', 'To confirm'],
  foot: ['هذه الصفحة للمتابعة الداخلية. كل بند «للتأكيد» ينتظر جواباً.', 'This page is for tracking. Each item marked "To confirm" waits for an answer.'],
  tbd: ['للتأكيد', 'To confirm'], ok: ['وصل', 'Received'],
  past: ['مضى', 'Passed'], today: ['اليوم', 'Today'], day: ['يوم', 'day'], days: ['أيام', 'days'],
};
const DATES = [
  ['2026-10-20', '2026-10-24', ['التصوير', 'Filming'], ['20–24 تشرين الأول', '20–24 October']],
  ['2026-10-22', null, ['الإحصاءات والصور من CTG', 'Stats and photos from CTG'], ['طُلبت قبل 22 تشرين الأول', 'Asked for by 22 October']],
  ['2026-10-25', '2026-10-28', ['المسودة الأولى للمونتاج', 'Rough cut'], ['25–28 تشرين الأول', '25–28 October']],
  ['2026-10-29', null, ['موافقة نسخة الحفل وتثبيتها', 'Gala cut approved and locked'], ['29 تشرين الأول', '29 October']],
  ['2026-10-29', null, ['تحديد المصوّر', 'Photographer set'], ['أسبوع قبل الحفل', 'One week before the gala']],
  ['2026-11-03', null, ['كل الملفات النهائية', 'All final assets'], ['3 تشرين الثاني', '3 November']],
  ['2026-11-05', null, ['الحفل', 'The gala'], ['5 تشرين الثاني', '5 November']],
];
const DELS = [
  [['الفيلم الوثائقي الرئيسي · 1', 'Master documentary · 1'], ['10–15 دقيقة. موقع CTG، يوتيوب، المتبرعون. الموعد: 3 تشرين الثاني («كل الملفات النهائية»).', '10–15 min. CTG website, YouTube, donor outreach. Due: 3 November ("all assets finalized").'], ['3 تشرين الثاني', '3 Nov']],
  [['نسخة الحفل · 1', 'Gala cut · 1'], ['5–7 دقائق، تُعرض يوم الحفل. المسودة 25–28 تشرين الأول، التثبيت 29 تشرين الأول.', '5–7 min, shown at the gala. Rough cut 25–28 October, locked 29 October.'], ['29 تشرين الأول', '29 Oct']],
  [['ريلز · 8', 'Reels · 8'], ['60–90 ثانية لكل ريل. ريل واحد كل أسبوع. القائمة تحت.', '60–90 s each. One reel a week. List below.'], null],
  [['صور فوتوغرافية', 'Still photos'], ['لكل منظمة، تُلتقط أثناء التصوير. للموقع والصحافة والمطبوعات.', 'Per organization, taken during filming. For the website, press and print.'], null],
];
const REELS = [
  [['قصة البداية: أول منحة', 'Founder origin story: the first stipend'], 'LinkedIn, Facebook'],
  [['IYT: قصة تحوّل طالب', 'IYT: student transformation story'], 'Instagram, YouTube Shorts'],
  [['Keep Going Sis: مضاعفة الوصول في السنة الثانية', 'Keep Going Sis: doubling reach in year two'], 'Instagram, TikTok'],
  [['Miracle University: خرّيج وُصف بأنه منقطع عن الدراسة', 'Miracle University: graduate who was labeled a dropout'], 'Instagram, YouTube Shorts'],
  [['NorCal Pharaohs: قصة طالب رياضي', 'NorCal Pharaohs: student athlete story'], 'Instagram, Facebook'],
  [['Sac PD Foundation: متدرّب أصبح طالباً جامعياً', 'Sac PD Foundation: cadet who became a college student'], 'LinkedIn, Facebook'],
  [['عضو مجلس: 20 سنة من القيادة التطوعية', 'Board member reflection: 20 years of volunteer leadership'], 'LinkedIn'],
  [['أثر CTG بالأرقام: ريل موشن جرافيك', 'CTG impact by the numbers: motion graphic reel'], ['كل المنصات', 'All platforms']],
];
const PAL = [
  ['Deep Teal', '#006B58'], ['Logo Teal', '#28A08C'], ['Logo Green', '#50B43C'], ['Charcoal', '#1A1A1A'], ['Off White', '#F9FBF9'],
];
const NEEDS = [
  [['مكان مواد تصوير 20–24 تشرين الأول', 'Where the 20–24 October footage is'], ['رابط واحد لكل الملفات الخام.', 'One link to all the raw files.']],
  [['الإحصاءات والصور', 'Stats and photos'], ['الأرقام بعد التحقق منها، كما في محاضر الاجتماع.', 'The figures after they are checked, as the meeting notes say.']],
];
const GOT = [
  [['إجابات الأسئلة (21 سؤالاً)', 'Answers to the 21 questions'], ['21 تشرين الأول', '21 October']],
  [['خطة محتوى الفيديو من CTG (PDF)', 'CTG video content strategy (PDF)'], ['21 تشرين الأول', '21 October']],
  [['محاضر اجتماع 16 تشرين الأول ولوحة الألوان (PDF)', 'Notes of the 16 October meeting, with the colour palette (PDF)'], ['21 تشرين الأول', '21 October']],
  [['جواب صافي: المطلوب والمصوّر', 'Safi\'s answer: requirements and photographer'], ['23 تشرين الأول', '23 October']],
];
const OPEN = [
  ['مدة نسخة الحفل: الخطة تقول 5–7 دقائق، ومحاضر 16 تشرين الأول تقول 7–10 دقائق.', 'Gala cut length: the strategy says 5–7 min; the 16 October notes say 7–10 min.'],
  ['بداية الريلز الأسبوعية: الخطة تذكر 20 تشرين الأول في قسم الريلز، و6 تشرين الثاني في الجدول الزمني.', 'Weekly reels start: the strategy says 20 October in the reels section and 6 November in the timeline.'],
  ['موعد تسليم الوثائقي الرئيسي: الخطة لا تذكر موعداً خاصاً به، فقط «كل الملفات النهائية» في 3 تشرين الثاني.', 'Master documentary due date: the strategy gives no date for it, only "all assets finalized" on 3 November.'],
  ['موعد تسليم الصور الفوتوغرافية.', 'Due date for the still photos.'],
  ['اسم المصوّر ورقمه: يُحدَّد قبل الحفل بأسبوع.', 'Photographer name and number: set one week before the event.'],
];
let L = 'ar';
try { const s = localStorage.getItem('ctg-lang'); if (s === 'en' || s === 'ar') L = s; } catch (e) {}
const i = () => (L === 'ar' ? 0 : 1);
const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const day0 = (d) => { const x = new Date(d + 'T00:00:00'); return x; };
function today() { const n = new Date(); return new Date(n.getFullYear(), n.getMonth(), n.getDate()); }
function diff(d) { return Math.round((day0(d) - today()) / 86400000); }
function leftTxt(start, end) {
  const a = diff(start), b = end ? diff(end) : a;
  if (b < 0) return T.past[i()];
  if (a <= 0) return T.today[i()];
  if (L === 'ar') return a + ' ' + (a === 1 ? 'يوم' : a <= 10 ? 'أيام' : 'يوماً');
  return a + ' ' + (a === 1 ? T.day[i()] : T.days[i()]);
}
function render() {
  document.documentElement.lang = L; document.documentElement.dir = L === 'ar' ? 'rtl' : 'ltr';
  document.querySelectorAll('[data-t]').forEach((el) => { el.textContent = T[el.dataset.t][i()]; });
  document.querySelectorAll('.lang button').forEach((b) => b.setAttribute('aria-pressed', String(b.dataset.lang === L)));
  const g = diff('2026-11-05'); document.getElementById('gdays').textContent = g >= 0 ? g : '0';
  let nextMarked = false;
  document.getElementById('dates').innerHTML = DATES.map(([s, e, w, d]) => {
    const past = (e ? diff(e) : diff(s)) < 0; let cls = past ? 'past' : '';
    if (!past && !nextMarked) { cls = 'next'; nextMarked = true; }
    return `<li class="${cls}"><span class="what">${esc(w[i()])}</span><span class="left">${esc(leftTxt(s, e))}</span><span class="when">${esc(d[i()])}</span></li>`;
  }).join('');
  document.getElementById('dels').innerHTML = DELS.map(([t, d, due]) => `<div class="row"><span class="t">${esc(t[i()])}</span><span class="tag${due ? ' ok' : ''}">${esc(due ? due[i()] : T.tbd[i()])}</span><span class="d">${esc(d[i()])}</span></div>`).join('');
  document.getElementById('reels').innerHTML = REELS.map(([t, p], k) => `<div class="reel"><span class="n">${k + 1}</span><span class="t">${esc(t[i()])}</span><span class="p" dir="ltr" style="text-align:start">${esc(Array.isArray(p) ? p[i()] : p)}</span></div>`).join('');
  document.getElementById('pal').innerHTML = PAL.map(([n, h]) => `<div><i style="background:${h}"></i>${esc(n)}<code>${esc(h)}</code></div>`).join('');
  document.getElementById('needs').innerHTML = NEEDS.map(([t, d]) => `<div class="row"><span class="t">${esc(t[i()])}</span><span class="tag">${esc(T.tbd[i()])}</span><span class="d">${esc(d[i()])}</span></div>`).join('');
  document.getElementById('got').innerHTML = GOT.map(([t, d]) => `<div class="row"><span class="t">${esc(t[i()])}</span><span class="tag ok">${esc(T.ok[i()])}</span><span class="d">${esc(d[i()])}</span></div>`).join('');
  document.getElementById('open').innerHTML = OPEN.map((q) => `<li>${esc(q[i()])}</li>`).join('');
  document.title = L === 'ar' ? 'حفل CTG · الحالة' : 'CTG Gala · Status';
}
document.querySelectorAll('.lang button').forEach((b) => b.addEventListener('click', () => {
  L = b.dataset.lang; try { localStorage.setItem('ctg-lang', L); } catch (e) {} render();
}));
render();
</script>
</body>
</html>
