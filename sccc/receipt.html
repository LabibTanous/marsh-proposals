<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>SCCC · Marsh</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{--ink:#1c1613;--ink2:#574d46;--line:#e3dbd2;--acc:#111;--bg:#fff}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:"IBM Plex Sans Arabic",system-ui,-apple-system,"Segoe UI",sans-serif;color:var(--ink);background:#f3eee8;line-height:1.5;-webkit-print-color-adjust:exact;print-color-adjust:exact}
.bar{max-width:820px;margin:16px auto 0;padding:0 16px;display:flex;flex-wrap:wrap;gap:10px}
.bar button,.bar a{font:inherit;font-weight:700;font-size:15px;border-radius:999px;padding:11px 20px;border:1px solid var(--ink);background:var(--bg);color:var(--ink);text-decoration:none;cursor:pointer;min-height:44px;display:inline-flex;align-items:center}
.bar .fill{background:var(--ink);color:#fff}
.bar p{flex-basis:100%;font-size:13.5px;color:var(--ink2)}
.sheet{max-width:820px;margin:14px auto 32px;background:var(--bg);padding:36px 40px;border:1px solid var(--line);border-radius:14px}
.top{display:flex;justify-content:space-between;align-items:flex-start;gap:16px;border-bottom:2px solid var(--ink);padding-bottom:16px}
.top img{height:34px}
.top h1{font-size:22px;line-height:1.25}
.meta{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px 18px;margin:18px 0 6px;font-size:14px}
.meta small{display:block;color:var(--ink2);font-size:12px}
.meta b{font-weight:600}
h2{font-size:14px;margin:22px 0 6px;color:var(--acc);text-transform:none}
table{width:100%;border-collapse:collapse;font-size:13.5px;table-layout:fixed}
th:nth-child(1){width:46%}th:nth-child(2),th:nth-child(4){width:18%}th:nth-child(3){width:18%}
th{font-size:12px;color:var(--ink2);font-weight:600;text-align:start;border-bottom:1px solid var(--ink);padding:6px 4px}
td{padding:7px 4px;border-bottom:1px solid var(--line);vertical-align:top}
td.n,th.n{text-align:end;white-space:nowrap;font-variant-numeric:tabular-nums}
.tot{margin-top:18px;margin-inline-start:auto;width:min(100%,360px);font-size:14px}
.tot div{display:flex;justify-content:space-between;gap:12px;padding:7px 0;border-bottom:1px solid var(--line)}
.tot .g{border-bottom:0;border-top:2px solid var(--ink);margin-top:4px;padding-top:10px;font-size:18px;font-weight:700}
.tot span:last-child{white-space:nowrap;font-variant-numeric:tabular-nums}
.notes{margin-top:18px;font-size:12.5px;color:var(--ink2);display:flex;flex-direction:column;gap:4px}
.foot{margin-top:24px;padding-top:12px;border-top:1px solid var(--line);font-size:12.5px;color:var(--ink2);display:flex;justify-content:space-between;flex-wrap:wrap;gap:8px}
.empty{max-width:820px;margin:60px auto;padding:0 16px;font-size:16px}
bdi{unicode-bidi:isolate}
@media(max-width:600px){.sheet{padding:22px 16px;border-radius:0;border-left:0;border-right:0}.meta{grid-template-columns:1fr 1fr}.top h1{font-size:18px}table{font-size:12.5px}}
@page{size:A4;margin:14mm}
@media print{body{background:#fff}.bar{display:none}.sheet{margin:0;max-width:none;border:0;border-radius:0;padding:0}tr,.tot,.notes{break-inside:avoid}}
</style>
</head>
<body>
<div class="bar" id="bar" hidden></div>
<main id="out"></main>
<script>
(function () {
  const L = {
    ar: { title: 'العرض المختار', client: 'العميل', date: 'التاريخ', plan: 'الخطة', none: '—', item: 'البند', unit: 'سعر الوحدة', qty: 'الكمية', total: 'المجموع', jod: 'دينار',
      v: 'الفيديوهات', o: 'مرة واحدة', m: 'شهرياً', once: 'المجموع لمرة واحدة', month: 'كل شهر', grand: 'المجموع الكلي', months: (n) => (n === 1 ? 'شهر واحد' : `${n} أشهر`),
      tbd: 'يُحدد لاحقاً', ads: (b) => `ميزانية الإعلانات ${b} دينار في الشهر تُدفع لميتا، وليست في المجموع.`, valid: 'الأسعار بالدينار الأردني.',
      save: 'احفظ PDF', wa: 'أرسل على واتساب', back: 'رجوع إلى الخطط', hint: 'في نافذة الطباعة اختر «حفظ كـ PDF»، ثم أرسل الملف لنا.', empty: 'لا يوجد اختيار. ارجع إلى صفحة الخطط.',
      foot: 'مارش للتسويق والتطوير · SCCC' },
    en: { title: 'Chosen package', client: 'Client', date: 'Date', plan: 'Plan', none: '—', item: 'Item', unit: 'Unit price', qty: 'Qty', total: 'Total', jod: 'JOD',
      v: 'Videos', o: 'One time', m: 'Monthly', once: 'One-time total', month: 'Each month', grand: 'Grand total', months: (n) => (n === 1 ? '1 month' : `${n} months`),
      tbd: 'To be decided', ads: (b) => `The ad budget of ${b} JOD a month is paid to Meta and is not in the total.`, valid: 'Prices are in Jordanian dinars (JOD).',
      save: 'Save PDF', wa: 'Send on WhatsApp', back: 'Back to the plans', hint: 'In the print window, choose "Save as PDF", then send the file to us.', empty: 'No choice found. Go back to the plans page.',
      foot: 'Marsh Marketing and Development · SCCC' },
  };
  const el = (tag, attrs, kids) => { const n = document.createElement(tag); Object.entries(attrs || {}).forEach(([k, v]) => { if (k === 'text') n.textContent = v; else n.setAttribute(k, v); }); (kids || []).forEach((c) => n.append(c)); return n; };
  const num = (x) => new Intl.NumberFormat('en-US', { maximumFractionDigits: 2 }).format(x);
  let r = null;
  try { r = JSON.parse(decodeURIComponent(location.hash.slice(1))); } catch (e) { r = null; }
  const ok = r && r.v === 1 && Array.isArray(r.lines) && r.lines.every((l) => typeof l.n === 'string' && isFinite(l.u) && isFinite(l.q) && isFinite(l.t));
  const lang = ok && r.lang === 'ar' ? 'ar' : (ok ? 'en' : (navigator.language || '').startsWith('ar') ? 'ar' : 'en'), t = L[lang];
  document.documentElement.lang = lang; document.documentElement.dir = lang === 'ar' ? 'rtl' : 'ltr';
  const out = document.getElementById('out'), bar = document.getElementById('bar');
  const back = el('a', { href: `./?view=plans&lang=${lang}`, text: t.back });
  if (!ok) { out.append(el('p', { class: 'empty' }, [t.empty + ' ', back])); return; }
  const money = (x) => `${num(x)} ${t.jod}`;
  const sheet = el('div', { class: 'sheet' });
  sheet.append(el('div', { class: 'top' }, [el('h1', { text: `${t.title} · SCCC` }), el('img', { src: 'assets/marsh-lockup.svg', alt: 'Marsh' })]));
  sheet.append(el('div', { class: 'meta' }, [
    el('div', {}, [el('small', { text: t.client }), el('b', { text: (r.name || '').slice(0, 80) || t.none })]),
    el('div', {}, [el('small', { text: t.date }), el('b', { text: String(r.date || '') })]),
    el('div', {}, [el('small', { text: t.plan }), el('b', { text: String(r.plan || '') })]),
  ]));
  [['v', t.v], ['o', t.o], ['m', t.m]].forEach(([g, h]) => {
    const rows = r.lines.filter((l) => l.g === g); if (!rows.length) return;
    sheet.append(el('h2', { text: h }));
    const tb = el('tbody', {}, rows.map((l) => el('tr', {}, [el('td', { text: l.n }), el('td', { class: 'n', text: money(l.u) }), el('td', { class: 'n' }, [el('bdi', { dir: 'ltr', text: l.qn ? `${num(l.q)} (${l.qn})` : num(l.q) })]), el('td', { class: 'n', text: money(l.t) })])));
    sheet.append(el('table', {}, [el('thead', {}, [el('tr', {}, [el('th', { text: t.item }), el('th', { class: 'n', text: t.unit }), el('th', { class: 'n', text: t.qty }), el('th', { class: 'n', text: t.total })])]), tb]));
  });
  const tbd = Array.isArray(r.tbd) ? r.tbd.filter((x) => typeof x === 'string') : [];
  sheet.append(el('div', { class: 'tot' }, [
    el('div', {}, [el('span', { text: t.once }), el('span', { text: money(r.once) })]),
    el('div', {}, [el('span', { text: t.month }), el('span', { text: money(Math.round(r.month * 100) / 100) })]),
    el('div', { class: 'g' }, [el('span', { text: `${t.grand} · ${t.months(+r.months || 1)}` }), el('span', { text: money(r.grand) + (tbd.length ? ` + ${t.tbd}` : '') })]),
  ]));
  const notes = [t.valid]; if (tbd.length) notes.push(`${t.tbd}: ${tbd.join(lang === 'ar' ? '، ' : ', ')}`); if (+r.adBudget > 0) notes.push(t.ads(num(+r.adBudget)));
  sheet.append(el('div', { class: 'notes' }, notes.map((x) => el('p', { text: x }))));
  sheet.append(el('div', { class: 'foot' }, [el('span', { text: t.foot }), el('bdi', { dir: 'ltr', text: '+962 79 563 1364 · marshteamjo@gmail.com' })]));
  out.append(sheet);
  const waTxt = [`${t.title} · SCCC${r.name ? ' · ' + r.name : ''}`, `${r.plan} · ${t.months(+r.months || 1)}`, `${t.once}: ${money(r.once)}`, `${t.month}: ${money(Math.round(r.month))}`, `${t.grand}: ${money(r.grand)}${tbd.length ? ' + ' + t.tbd : ''}`].join('\n');
  const save = el('button', { type: 'button', class: 'fill', text: t.save }); save.addEventListener('click', () => window.print());
  bar.append(save, el('a', { href: `https://wa.me/${/^\d{8,15}$/.test(String(r.wa)) ? r.wa : '962795631364'}?text=${encodeURIComponent(waTxt)}`, target: '_blank', rel: 'noopener', text: t.wa }), back, el('p', { text: t.hint }));
  bar.hidden = false;
  document.title = `${t.title} · SCCC${r.name ? ' · ' + r.name : ''}`;
  const ios = /iPhone|iPad|iPod/.test(navigator.userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);   // iOS prints only from a tap
  if (!ios && !/[?&]noprint/.test(location.search)) setTimeout(() => window.print(), 600);
})();
</script>
</body>
</html>
