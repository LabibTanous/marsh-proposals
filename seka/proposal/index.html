<script>
/* theme before paint: ?style= ?mode= or the saved choice */
(function () {
  var q = new URLSearchParams(location.search), h = document.documentElement, S = ['marsh', 'mm', 'smoke', 'mono', 'fire'];
  function get(k) { try { return JSON.parse(localStorage.getItem('mm2-' + k)); } catch (e) { return null; } }
  var st = q.get('style') || get('style'), md = q.get('mode') || get('mode');
  h.dataset.style = S.indexOf(st) >= 0 ? st : 'marsh';
  h.dataset.mode = md === 'light' || md === 'dark' ? md : (matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark');
})();
</script>
<style>
/* ---------- style (accent family) ---------- */
:root{
  --acc-d:#ef3b43; --acc-l:#c8141c; --acc-rgb-d:239,59,67; --acc-rgb-l:200,20,28; --on-acc-d:#fff; --on-acc-l:#fff;
  --sec-d:#e9d9c9; --sec-l:#6f6967;
  --head-ar:'Tajawal'; --head-en:'Albert Sans'; --hw-ar:900; --hw-en:800; --radius:18px;
}
html[data-style=mm]{--acc-d:#ef8903;--acc-l:#b06300;--acc-rgb-d:239,137,3;--acc-rgb-l:176,99,0;--on-acc-d:#171718;--on-acc-l:#fff;--sec-d:#bc955a;--sec-l:#7c6441;--head-en:'Playfair Display';--hw-en:700}
html[data-style=mm][data-mode=dark]{--bg:#171718;--bg-rgb:23,23,24;--bg2:#1e1e1c;--bg3:#262624}
html[data-style=smoke]{--acc-d:#d9b98a;--acc-l:#8a6732;--acc-rgb-d:217,185,138;--acc-rgb-l:138,103,50;--on-acc-d:#160c05;--on-acc-l:#fff;--sec-d:#f07a2e;--sec-l:#b5531a;--head-ar:'Amiri';--head-en:'Instrument Serif';--hw-ar:700;--hw-en:400;--radius:6px}
html[data-style=mono]{--acc-d:#f3ece4;--acc-l:#1c1613;--acc-rgb-d:243,236,228;--acc-rgb-l:28,22,19;--on-acc-d:#0d0b0a;--on-acc-l:#fff;--sec-d:#9c9189;--sec-l:#8a7f77;--hw-ar:800;--hw-en:700;--radius:4px}
html[data-style=fire]{--acc-d:#ff5a1f;--acc-l:#d63a0a;--acc-rgb-d:255,90,31;--acc-rgb-l:214,58,10;--on-acc-d:#160c05;--on-acc-l:#fff;--sec-d:#ffc24a;--sec-l:#a8680f;--radius:26px}
/* ---------- mode ---------- */
html[data-mode=dark]{--bg:#0d0b0a;--bg-rgb:13,11,10;--bg2:#14110f;--bg3:#1c1815;--text:#f3ece4;--text2:#bdb2a6;--muted:#8c8279;--ink-rgb:243,236,228;
  --line:rgba(240,228,214,.11);--line2:rgba(240,228,214,.22);--card:rgba(255,240,225,.035);--grain:.045;--shadow:rgba(0,0,0,.55);
  --accent:var(--acc-d);--acc-rgb:var(--acc-rgb-d);--on-accent:var(--on-acc-d);--sec:var(--sec-d);color-scheme:dark}
html[data-mode=light]{--bg:#f6f1ea;--bg-rgb:246,241,234;--bg2:#fffdf9;--bg3:#ece4da;--text:#1c1613;--text2:#574d46;--muted:#776c63;--ink-rgb:28,22,19;
  --line:rgba(28,22,19,.12);--line2:rgba(28,22,19,.24);--card:rgba(28,22,19,.03);--grain:.02;--shadow:rgba(70,45,20,.2);
  --accent:var(--acc-l);--acc-rgb:var(--acc-rgb-l);--on-accent:var(--on-acc-l);--sec:var(--sec-l);color-scheme:light}
:root{--accent-a:rgba(var(--acc-rgb),.14);--accent-b:rgba(var(--acc-rgb),.42);
  --ar:'Tajawal','Albert Sans',system-ui,sans-serif;--en:'Albert Sans','Tajawal',system-ui,sans-serif;--mono:'JetBrains Mono',ui-monospace,monospace;
  --ease:cubic-bezier(.2,.7,.2,1);--gutter:clamp(16px,5vw,72px)}

*{box-sizing:border-box;margin:0;padding:0}
html{background:var(--bg);color:var(--text);-webkit-text-size-adjust:100%;transition:background-color .4s}
html.lenis,html.lenis body{height:auto}
.lenis.lenis-smooth{scroll-behavior:auto!important}
.lenis.lenis-stopped{overflow:hidden}
body{font-family:var(--ar);font-size:clamp(15.5px,1.08vw,18px);line-height:1.7;background:var(--bg);color:var(--text);overflow-x:hidden}
html[lang=en] body{font-family:var(--en);line-height:1.55;font-size:clamp(15px,1.02vw,17px)}
img{display:block;max-width:100%}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
a{color:inherit}
::selection{background:var(--accent);color:var(--on-accent)}
:focus-visible{outline:2px solid var(--accent);outline-offset:3px;border-radius:4px}
.wrap{width:100%;max-width:1320px;margin:0 auto;padding-inline:var(--gutter)}
.lat{font-family:var(--en)}
.num{font-variant-numeric:tabular-nums}
.label{font-size:12.5px;font-weight:700;color:var(--muted)}
html[lang=en] .label{font-family:var(--mono);font-weight:500;font-size:11.5px;letter-spacing:.14em;text-transform:uppercase}
.idx{font-family:var(--mono);font-size:12px;color:var(--accent);letter-spacing:.1em;display:inline-block;margin-bottom:14px}
html[data-style=marsh] .idx{display:inline-grid;place-items:center;width:40px;height:40px;border:2px solid var(--accent);font-weight:500;letter-spacing:0;font-size:13px}
h1,h2{font-family:var(--head-ar),var(--ar);font-weight:var(--hw-ar)}
html[lang=en] h1,html[lang=en] h2{font-family:var(--head-en),var(--en);font-weight:var(--hw-en)}
h2{font-size:clamp(42px,6.6vw,100px);line-height:1.08}
html[lang=en] h2{line-height:.98;letter-spacing:-.03em}
html[lang=en][data-style=smoke] h2,html[lang=en][data-style=smoke] h1{letter-spacing:-.01em;line-height:1}
h3{font-weight:800;font-size:clamp(18px,1.6vw,23px);line-height:1.35}
html[lang=en] h3{font-weight:700;letter-spacing:-.01em}
html[data-style=fire] h2{background:linear-gradient(90deg,#e9212a,#ff6a1f 55%,#ffc24a);-webkit-background-clip:text;background-clip:text;color:transparent}
html[data-style=fire][data-mode=light] h2,html[data-style=fire][data-mode=light] .hero h1 .l:nth-child(3){background-image:linear-gradient(90deg,#b3161d,#c2410c 55%,#9a5b06)}
.sub{color:var(--text2);max-width:60ch;margin-top:18px;font-size:clamp(16px,1.2vw,19.5px)}
section{position:relative}
.sec{padding-block:clamp(90px,14vh,170px)}
.tbd{display:inline-block;padding:0 .5em;border:1px dashed var(--accent-b);border-radius:6px;color:var(--accent);background:var(--accent-a);font-size:.9em;white-space:nowrap;font-family:var(--ar)}
html[lang=en] .tbd{font-family:var(--en)}
body::after{content:"";position:fixed;inset:-50%;z-index:90;pointer-events:none;opacity:var(--grain);
  background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.85' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E")}

/* loader */
#loader{position:fixed;inset:0;z-index:200;background:var(--bg);display:grid;place-items:center;animation:loaderOut .6s 3.4s forwards}
#loader .lt{font-weight:900;font-size:clamp(28px,4.6vw,58px);overflow:hidden;text-align:center;padding:0 16px}
#loader .lt span{display:inline-block;transform:translateY(110%);animation:rise .9s var(--ease) forwards}
#loader .bar{position:absolute;left:50%;bottom:16vh;width:min(260px,60vw);height:1px;background:var(--line);transform:translateX(-50%);overflow:hidden}
#loader .bar i{position:absolute;inset:0;background:var(--accent);transform-origin:left;transform:scaleX(0);transition:transform .4s var(--ease)}
@keyframes rise{to{transform:none}}
@keyframes loaderOut{to{opacity:0;visibility:hidden}}

/* topbar */
.topbar{position:fixed;inset:0 0 auto 0;z-index:60;display:flex;justify-content:space-between;align-items:center;gap:12px;padding:12px var(--gutter);
  background:linear-gradient(to bottom,rgba(var(--bg-rgb),.92),rgba(var(--bg-rgb),0));pointer-events:none}
.topbar>*{pointer-events:auto}
.brand{display:flex;align-items:center;gap:12px;text-decoration:none;min-width:0}
.brand img{height:26px;width:auto}
html[data-mode=dark] .logo-l,html[data-mode=light] .logo-d{display:none}
.brand span{font-size:13px;color:var(--text2);font-weight:700;border-inline-start:1px solid var(--line2);padding-inline-start:12px;white-space:nowrap}
.tools{display:flex;align-items:center;gap:8px}
.sec-now{font-size:12.5px;font-weight:700;color:var(--text2);min-width:9ch;text-align:end;margin-inline-end:4px}
html[lang=en] .sec-now{font-family:var(--mono);font-size:11px;font-weight:500;letter-spacing:.12em;text-transform:uppercase}
.pill{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--line2);border-radius:999px;padding:3px;background:rgba(var(--bg-rgb),.7);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);min-height:40px}
.seg button{padding:5px 12px;border-radius:999px;font-size:13.5px;font-weight:700;min-height:32px}
.seg button[aria-pressed=true]{background:var(--text);color:var(--bg)}
.vseg{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);z-index:2}
.vseg button{padding:6px 16px;font-size:14px}
.vseg button[aria-pressed=true]{background:var(--accent);color:var(--on-accent,#fff)}
.vseg button{white-space:nowrap}
@media(max-width:1100px){.vseg{position:fixed;top:64px;transform:translateX(-50%)}body .hero{padding-top:128px}.pages-view>section:first-child{padding-top:150px}}
@media(max-width:760px){.vseg button{padding:5px 13px;font-size:13.5px}}
.pages-view{min-height:100vh}
.pv-loading{padding:160px var(--gutter);text-align:center;color:var(--text2)}
.tbtn{display:inline-grid;place-items:center;min-width:34px;height:32px;border-radius:999px;padding:0 10px;font-size:13px;font-weight:700;gap:6px;grid-auto-flow:column}
.tbtn:hover{background:var(--card)}
.tbtn svg{width:17px;height:17px}
.sw{width:16px;height:16px;border-radius:50%;background:conic-gradient(var(--accent) 0 50%,var(--sec) 50% 100%);border:1px solid var(--line2);display:inline-block}
.stylewrap{position:relative}
.stylepop{position:absolute;top:calc(100% + 10px);inset-inline-end:0;width:240px;border:1px solid var(--line2);border-radius:16px;background:var(--bg2);box-shadow:0 30px 60px var(--shadow);padding:8px;z-index:70}
.stylepop[hidden]{display:none}
.stylepop button{display:flex;align-items:center;gap:12px;width:100%;padding:10px;border-radius:10px;text-align:start;font-weight:700;font-size:14px}
.stylepop button:hover,.stylepop button[aria-checked=true]{background:var(--card)}
.stylepop button[aria-checked=true]::after{content:"✓";margin-inline-start:auto;color:var(--accent)}
.stylepop i{width:28px;height:28px;border-radius:8px;flex:none;border:1px solid var(--line2)}
.progress{position:fixed;inset:0 0 auto 0;height:2px;z-index:61}
.progress i{display:block;height:100%;background:var(--accent);transform-origin:left;transform:scaleX(0)}
html[dir=rtl] .progress i{transform-origin:right}
html[data-style=fire] .progress i{background:linear-gradient(90deg,#e9212a,#ff6a1f,#ffc24a)}
@media(max-width:760px){.brand span,.sec-now,.tbtn .tl{display:none}.brand img{height:22px}.stylepop{position:fixed;top:64px;inset-inline:12px;width:auto}.pill{backdrop-filter:none;-webkit-backdrop-filter:none;background:rgba(var(--bg-rgb),.94)}}

/* side index */
.index{position:fixed;inset-inline-end:clamp(10px,1.6vw,26px);top:50%;transform:translateY(-50%);z-index:55;display:flex;flex-direction:column;gap:10px}
.index a{display:flex;align-items:center;justify-content:flex-end;gap:10px;text-decoration:none;height:14px}
.index a span{font-size:12px;font-weight:700;color:var(--text2);opacity:0;transform:translateX(6px);transition:.3s var(--ease);white-space:nowrap}
html[dir=rtl] .index a span{transform:translateX(-6px)}
.index a i{width:6px;height:6px;border-radius:50%;background:var(--line2);transition:.3s var(--ease);flex:none}
.index a:hover span,.index a:focus-visible span{opacity:1;transform:none}
.index a.on i{background:var(--accent);box-shadow:0 0 0 4px var(--accent-a);transform:scale(1.25)}
@media(max-width:1000px){.index{display:none}}

/* hero */
.hero{min-height:100svh;display:grid;align-items:center;overflow:hidden;padding-top:80px}
.hero-grid{display:grid;grid-template-columns:minmax(0,1.05fr) minmax(0,1fr);gap:clamp(20px,4vw,60px);align-items:center;width:100%}
.hero h1{font-size:clamp(38px,4.5vw,80px);line-height:1.08;margin:16px 0 26px}
.hero h1 .l{white-space:nowrap}
@media(max-width:900px){.hero h1 .l{white-space:normal}html[lang=en] .hero h1{font-size:min(44px,11vw)}}
html[lang=en] .hero h1{letter-spacing:-.035em;line-height:.94;font-size:clamp(40px,4.6vw,84px)}
.hero h1 .l{display:block}
.hero h1 .l:nth-child(2){color:var(--sec)}
.hero h1 .l:nth-child(3){color:var(--accent)}
html[data-style=fire] .hero h1 .l:nth-child(3){background:linear-gradient(90deg,#e9212a,#ff6a1f 55%,#ffc24a);-webkit-background-clip:text;background-clip:text;color:transparent}
.hero .lede{max-width:46ch;font-size:clamp(16.5px,1.35vw,21px)}
.hero .meta{margin-top:16px;color:var(--text2);font-size:14px}
.dish{position:relative;aspect-ratio:1/1;justify-self:center;width:min(100%,620px)}
.dish .glow{position:absolute;inset:8%;border-radius:50%;background:radial-gradient(circle,rgba(var(--acc-rgb),.32),rgba(var(--acc-rgb),0) 66%);filter:blur(30px)}
html[data-mode=light] .dish .glow{opacity:.55}
.dish img{position:absolute;inset:10% 4%;width:92%;height:80%;object-fit:cover;border-radius:calc(var(--radius) + 10px);box-shadow:0 60px 120px var(--shadow);will-change:transform}
.dish canvas{position:absolute;left:-10%;top:-10%;width:120%;height:110%;pointer-events:none}
.hero-copy{padding-block:20px clamp(40px,8vh,100px)}
.cue{display:flex;align-items:center;gap:10px;margin-top:34px;color:var(--muted);font-size:13px}
.cue i{width:1px;height:46px;background:linear-gradient(var(--accent),transparent);animation:cue 2.2s var(--ease) infinite;transform-origin:top}
@keyframes cue{0%{transform:scaleY(0)}50%{transform:scaleY(1)}100%{transform:scaleY(1);opacity:0}}
@media(max-width:900px){.hero-grid{grid-template-columns:1fr}.dish{order:-1;width:min(100%,440px)}.hero{align-items:start}.cue{display:none}}

/* key terms */
.terms-grid{display:grid;grid-template-columns:repeat(12,1fr);gap:1px;background:var(--line);border:1px solid var(--line);border-radius:var(--radius);overflow:hidden;margin-top:52px}
.term{background:var(--bg);padding:24px 24px 26px;grid-column:span 4;display:flex;flex-direction:column;gap:10px;transition:background .4s var(--ease)}
.term:hover{background:var(--bg2)}
.term.wide{grid-column:span 6}
@media(max-width:900px){.term,.term.wide{grid-column:span 12}}

/* facts */
.facts{display:grid;grid-template-columns:repeat(5,1fr);margin-top:60px;border-top:1px solid var(--line)}
.fact{padding:26px 0 24px;padding-inline-end:18px;border-bottom:1px solid var(--line)}
.fact b{display:block;white-space:nowrap;font-weight:800;font-size:clamp(36px,4.4vw,72px);line-height:1;letter-spacing:-.02em;font-variant-numeric:tabular-nums;font-family:var(--en)}
.fact b small{font-size:.45em;font-weight:700;color:var(--text2);letter-spacing:0}
.fact > span{display:block;margin-top:10px;color:var(--text2);font-size:14px}
.fact.hot b{color:var(--accent)}
@media(max-width:900px){.facts{grid-template-columns:repeat(2,1fr)}.fact.hot{grid-column:span 2}}
.src{margin-top:20px;color:var(--muted);font-size:13.5px;max-width:80ch}
.asked{margin-top:34px;display:grid;grid-template-columns:auto 1fr;gap:18px;align-items:start;padding:22px 24px;border:1px solid var(--line);border-radius:var(--radius);background:var(--card)}
.asked p{font-size:clamp(17px,1.4vw,22px);font-weight:700}
.heard{margin-top:40px;display:grid;gap:12px}
.hrow{display:grid;grid-template-columns:44px 1fr 1fr;gap:6px 24px;align-items:start;padding:18px 20px;border:1px solid var(--line);border-radius:var(--radius);background:var(--card)}
.hn{font-family:var(--mono);font-size:12px;color:var(--accent);padding-top:4px}
.hq{font-size:clamp(16px,1.3vw,19px);font-weight:700;color:var(--text2)}
.ha{font-size:clamp(16px,1.3vw,19px);font-weight:800}
@media(max-width:760px){.hrow{grid-template-columns:32px 1fr}.ha{grid-column:2}}
.ideas{margin-top:40px;display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px}
.idea,.event{padding:18px 20px;border:1px solid var(--line);border-radius:var(--radius);background:var(--card)}
.idea .pn{font-family:var(--mono);font-size:12px;color:var(--accent)}
.idea h3,.event h3{font-size:clamp(18px,1.5vw,22px);margin:6px 0 8px}
.idea p,.event p{color:var(--text2);font-size:14.5px}
.idea .ev{margin-top:10px;padding-top:10px;border-top:1px solid var(--line);color:var(--text);font-weight:700}
.ev-h{margin-top:40px;font-size:clamp(20px,1.8vw,26px)}
.events{margin-top:14px;display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:12px}
.event .when{font-family:var(--mono);font-size:12px;color:var(--accent)}
.scope{margin-top:10px;font-weight:700}
.steps{margin:22px 0 26px;padding-inline-start:22px;display:grid;gap:10px;font-size:clamp(16px,1.3vw,19px);font-weight:700}
.found{margin-top:34px;padding:22px 24px;border:1px solid var(--line);border-radius:var(--radius);background:var(--card)}
.found ul{margin:12px 0 0;padding-inline-start:20px;display:grid;gap:8px;font-size:clamp(15px,1.1vw,17px)}
.pv-go{margin-top:18px}
html[lang=en] .asked p{font-weight:600}
@media(max-width:700px){.asked{grid-template-columns:1fr;gap:8px}}

/* building (3D) */
.building{padding-block:clamp(64px,9vh,110px) 24px}
.building h2{font-size:clamp(36px,4.2vw,68px)}
.building .sub{margin-top:10px;font-size:clamp(15px,1.05vw,17px)}
.b-grid{display:grid;grid-template-columns:minmax(0,.85fr) minmax(0,1.8fr);gap:clamp(20px,3vw,48px);align-items:center}
.floor-list{display:flex;flex-direction:column;margin-top:30px}
.floor-list button{display:grid;grid-template-columns:44px 1fr;gap:2px 14px;text-align:start;padding:10px 4px;border-bottom:1px solid var(--line);transition:padding .35s var(--ease),background .3s;border-radius:8px}
.floor-list .n{font-family:var(--mono);font-size:11.5px;color:var(--accent);grid-row:span 2;padding-top:5px}
.floor-list .t{font-size:clamp(17px,1.5vw,21px);font-weight:800}
.floor-list .d{color:var(--text2);font-size:13px;line-height:1.5}
.floor-list button:hover,.floor-list button.hl,.floor-list button[aria-pressed=true]{padding-inline-start:14px;background:var(--card)}
.floor-list button[aria-pressed=true] .t{color:var(--accent)}

.sumcol{position:sticky;top:96px;display:flex;flex-direction:column;gap:16px}
.sumcol .sendbox{margin-top:0;grid-template-columns:minmax(0,1fr)}
.sumcol .sendbox .btn{justify-content:center}
.plans-view{padding-top:96px}
.plans-view .sec{padding-top:24px}
.guide{margin-top:22px;display:grid;grid-template-columns:minmax(0,1.6fr) minmax(0,1fr);gap:18px 28px;align-items:center}
.guide img{width:100%;height:auto;border:1px solid var(--line);border-radius:calc(var(--radius) + 2px);background:var(--bg2)}
.guide-steps{margin:0;padding-inline-start:22px;display:flex;flex-direction:column;gap:8px;font-size:15px;color:var(--text2)}
.guide-steps li::marker{color:var(--accent);font-weight:800}
@media(max-width:760px){.guide{grid-template-columns:1fr}}
@media(max-width:430px){.vseg button{padding:6px 10px;font-size:13px}}
.sum .rows{padding:6px 20px 14px}
.sum .r{display:flex;justify-content:space-between;gap:12px;padding:10px 0;border-bottom:1px solid var(--line);font-size:15px}
.sum .r b{font-family:var(--en);font-weight:500;text-align:end;min-width:0}
.sum .r b bdi,.sum .r b .tbd{white-space:nowrap}
.sum .r.big{border-bottom:0;padding-top:16px;font-size:17px}
.sum .r.big b{font-size:clamp(19px,5.4vw,26px);color:var(--accent)}
.sum .note{padding:0 20px 18px;color:var(--muted);font-size:13px}
.sendbox{margin-top:24px;padding:18px 20px;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:12px 16px;align-items:end}
.sendbox label{display:block;font-weight:800;font-size:14.5px;margin-bottom:6px}
.sendbox input{width:100%;min-height:46px;border:1px solid var(--line2);border-radius:12px;background:var(--bg2);color:var(--text);padding:10px 14px;font:inherit}
.sendbox button.btn{cursor:pointer;font:inherit;font-weight:800}
.sendbox button.btn:disabled{opacity:.6;cursor:progress;transform:none}
.sendbox .st{grid-column:1/-1;font-size:14.5px;color:var(--text2)}
.sendbox .st:empty{display:none}
.sendbox .st.ok{color:var(--accent);font-weight:700}
.sendbox .st.err{color:var(--text);font-weight:700;border:1px dashed var(--accent-b);border-radius:8px;padding:6px 10px;background:var(--accent-a)}
@media(max-width:600px){.item{grid-template-columns:auto minmax(0,1fr)}.item .amt{grid-column:2;text-align:start}.sendbox{grid-template-columns:minmax(0,1fr)}.sendbox button.btn{justify-content:center}}
.paid{margin-top:24px;display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
.paid div{border:1px solid var(--line);border-radius:var(--radius);padding:16px 18px;background:var(--card)}
.paid b{display:block;margin-bottom:4px}
.paid span{color:var(--text2);font-size:14px}
.terms{margin-top:18px;color:var(--text2);font-size:14.5px;max-width:90ch}
@media(max-width:900px){.plans{grid-template-columns:1fr}.setup{grid-template-columns:1fr}.sumcol{position:relative;top:auto}.paid{grid-template-columns:1fr}}

/* rules + needs */
.rules{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-top:50px}
.rules div{border:1px solid var(--line);border-radius:var(--radius);padding:20px 22px;background:var(--card);transition:border-color .3s}
.rules div:hover{border-color:var(--accent-b)}
.rules b{display:block;color:var(--accent);margin-bottom:6px;font-weight:800}
.rules p{color:var(--text2);font-size:14.5px}
@media(max-width:900px){.rules{grid-template-columns:1fr}}
.needs-h{margin-top:110px;font-size:clamp(34px,4.6vw,70px)!important}
.needs{list-style:none;counter-reset:n;display:grid;grid-template-columns:1fr 1fr;gap:0 40px;margin-top:46px}
.needs li{counter-increment:n;display:grid;grid-template-columns:40px 1fr;gap:10px;padding:16px 0;border-bottom:1px solid var(--line)}
.needs li::before{content:counter(n,decimal-leading-zero);font-family:var(--mono);font-size:12px;color:var(--accent);padding-top:4px}
@media(max-width:800px){.needs{grid-template-columns:1fr}}

.next{padding-block:clamp(100px,16vh,190px);text-align:center;background:radial-gradient(60% 60% at 50% 100%,var(--accent-a),transparent 70%)}
.next h2{max-width:16ch;margin:0 auto}

.contact{display:flex;justify-content:center;gap:12px;flex-wrap:wrap;margin-top:34px}
.foot{display:flex;justify-content:center;align-items:center;gap:14px;margin-top:70px;color:var(--muted);font-size:13px;flex-wrap:wrap}
.foot img{height:24px}

}

/* ---------- channels flow ---------- */
let chipSel = -1, setChip = () => {};
(function () {
  const cv = $('#flow'), wrap = $('#flowWrap'), ctx = cv.getContext('2d');
  let W = 0, H = 0, chipX = [], running = false, raf = 0, lastT = 0;

    cv.width = W * dpr; cv.height = H * dpr; ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

  for (let i = 0; i < N; i++) { const p = {}; spawn(p, true); P.push(p); }
  function pos(p) {
    if (p.loop) { const u = p.u, a = 1 - u, x2 = chipX[p.src] ?? cx(); return [a * a * a * cx() + 3 * a * a * u * W * 0.985 + 3 * a * u * u * W * 0.985 + u * u * u * x2, a * a * a * H * 0.94 + 3 * a * a * u * H * 0.98 + 3 * a * u * u * H * 0.06 + u * u * u * -6]; }
    const y = p.t * H * 0.94, sx = chipX[p.src] ?? cx(), k = Math.min(1, p.t / 0.22), s = k * k * (3 - 2 * k), fx = cx() + p.lane * half(y) * 0.86;

/* ---------- hero embers ---------- */
(function () {

  const ctx = cv.getContext('2d'); let W = 0, H = 0, run = false, raf = 0; const E = [];
  function size() { const r = cv.getBoundingClientRect(), d = Math.min(2, devicePixelRatio || 1); W = r.width; H = r.height; cv.width = W * d; cv.height = H * d; ctx.setTransform(d, 0, 0, d, 0, 0); }
