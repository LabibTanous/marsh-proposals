<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>مارش · تصدير مجموعة واتساب</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--red:#E9212A;--red-d:#C8161E;--ink:#141414;--mute:#5F636A;--line:#DADCD8;--bg:#F2F3F1;--card:#FFFFFF;--soft:#FDECEC}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:'IBM Plex Sans Arabic',system-ui,-apple-system,sans-serif;font-size:16px;line-height:1.6}
.wrap{max-width:560px;margin:0 auto;padding:16px 16px 64px;display:flex;flex-direction:column;gap:14px}
header{display:flex;align-items:center;justify-content:space-between;gap:12px;background:var(--card);border-radius:999px;padding:8px 10px 8px 16px;box-shadow:0 1px 2px rgb(0 0 0/.04),0 8px 24px rgb(0 0 0/.04)}
[dir=rtl] header{padding:8px 16px 8px 10px}
.brand{display:flex;align-items:center;gap:10px}
.mark{width:32px;height:32px;border:2px solid var(--red);display:grid;place-items:center;font-weight:700;font-size:15px}
.brand strong{font-size:15px;display:block;line-height:1.2}
.brand span{font-size:12px;color:var(--mute)}
button{font:inherit;cursor:pointer;color:inherit}
button:focus-visible,a:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
.lang{border:1px solid var(--line);background:var(--card);border-radius:999px;padding:6px 14px;font-size:13px;font-weight:600;min-height:36px}
.card{background:var(--card);border-radius:20px;padding:18px;box-shadow:0 1px 2px rgb(0 0 0/.04),0 8px 24px rgb(0 0 0/.04)}
h1{font-size:22px;line-height:1.35;margin:0 0 6px}
h2{font-size:17px;margin:0 0 8px}
p{margin:0}
.mute{color:var(--mute);font-size:14px}
.tabs{display:grid;grid-template-columns:1fr 1fr;gap:6px;background:var(--card);border-radius:999px;padding:5px;box-shadow:0 1px 2px rgb(0 0 0/.04)}
.tab{border:0;background:transparent;border-radius:999px;padding:10px;font-weight:600;font-size:15px;min-height:44px}
.tab[aria-selected=true]{background:var(--ink);color:#fff}
.step{display:flex;flex-direction:column;gap:12px}
.step-head{display:flex;align-items:center;gap:10px}
.num{flex:0 0 auto;width:30px;height:30px;border-radius:999px;background:var(--red);color:#fff;display:grid;place-items:center;font-weight:700;font-size:15px;font-variant-numeric:tabular-nums}
.step-head h2{margin:0}
.fig{background:var(--bg);border-radius:16px;padding:14px;display:flex;justify-content:center}
.fig svg{width:190px;height:auto;display:block}
ol{margin:0;padding-inline-start:22px}
ol li{margin:2px 0}
.ui{font-weight:700;background:var(--soft);color:var(--red-d);border-radius:6px;padding:0 6px;white-space:nowrap}
.link-box{display:flex;flex-direction:column;gap:8px;border:1px solid var(--line);border-radius:14px;padding:12px}
.link-box code{font-family:ui-monospace,Menlo,monospace;font-size:13px;direction:ltr;unicode-bidi:isolate;word-break:break-all;text-align:left}
.row{display:flex;gap:8px;flex-wrap:wrap}
.btn{border:0;border-radius:999px;padding:10px 16px;font-weight:600;font-size:14px;min-height:44px;text-decoration:none;display:inline-flex;align-items:center;justify-content:center}
.btn-red{background:var(--red);color:#fff}
.btn-red:hover{background:var(--red-d)}
.btn-line{background:var(--card);border:1px solid var(--line);color:var(--ink)}
ul.notes{margin:0;padding-inline-start:20px}
ul.notes li{margin:4px 0}
.groups{border-inline-start:3px solid var(--red);padding-inline-start:12px}
[hidden]{display:none!important}
</style>
</head>
<body>
<div class="wrap">

<header>
  <div class="brand">
    <div class="mark" aria-hidden="true">م</div>
    <div><strong data-t="brand"></strong><span data-t="brandSub"></span></div>
  </div>
  <button class="lang" id="lang" type="button"></button>
</header>

<section class="card">
  <h1 data-t="title"></h1>
  <p class="mute" data-t="intro"></p>
</section>

<section class="card groups">
  <h2 data-t="groupsH"></h2>
  <ol>
    <li data-t="g1"></li>
    <li data-t="g2"></li>
  </ol>
  <p class="mute" style="margin-top:6px" data-t="groupsNote"></p>
</section>

<div class="tabs" role="tablist" aria-label="phone">
  <button class="tab" role="tab" id="tab-ios" aria-selected="true" aria-controls="steps" data-os="ios" data-t="iphone"></button>
  <button class="tab" role="tab" id="tab-android" aria-selected="false" aria-controls="steps" data-os="android" data-t="androidL"></button>
</div>

<div id="steps" role="tabpanel" style="display:flex;flex-direction:column;gap:14px"></div>

<section class="card">
  <h2 data-t="notesH"></h2>
  <ul class="notes">
    <li data-t="n1"></li>
    <li data-t="n2"></li>
    <li data-t="n3"></li>
    <li data-t="n4"></li>
  </ul>
</section>

</div>

<script>
var URL_REQ = 'https://www.dropbox.com/request/sr50rgynaq70g6adwfsf';

var T = {
  ar: {
    brand:'مارش', brandSub:'تصدير مجموعة واتساب', langBtn:'English',
    title:'تصدير مجموعة واتساب مع الصور والرسائل الصوتية',
    intro:'4 خطوات من هاتفك. التصدير من الهاتف يحمل الصور والفيديو والرسائل الصوتية. واتساب ويب لا يحملها.',
    groupsH:'أي مجموعات؟',
    g1:'مجموعة مريم أولًا.',
    g2:'ثم كل مجموعة عمل تريد أن ندرسها من أولها لآخرها. صدّر كل مجموعة وحدها.',
    groupsNote:'مجموعات العمل فقط. لا ترسل محادثات شخصية.',
    iphone:'آيفون', androidL:'أندرويد',
    stepWord:'الخطوة',
    copy:'انسخ الرابط', copied:'تم النسخ', open:'افتح رابط الرفع',
    notesH:'ملاحظات',
    n1:'المجموعة الكبيرة تأخذ وقتًا للتجهيز. اترك واتساب مفتوحًا حتى تظهر قائمة المشاركة.',
    n2:'إذا كانت المجموعة طويلة جدًا، قد يترك واتساب الوسائط القديمة. إذا حصل ذلك، أخبر لبيب.',
    n3:'إذا لم يظهر خيار التصدير، فقد يكون مقفلًا في إعدادات خصوصية المجموعة. أخبر لبيب.',
    n4:'الملف يصل إلى مجلد مارش في دروب بوكس فقط. لا يُرسل لأحد آخر.',
    ios:[
      {h:'افتح المجموعة', li:['افتح واتساب، ثم المجموعة.','اضغط <span class="ui">اسم المجموعة</span> في الأعلى.']},
      {h:'تصدير الدردشة', li:['انزل لآخر الصفحة.','اضغط <span class="ui">تصدير الدردشة</span>.']},
      {h:'إرفاق الوسائط', li:['اضغط <span class="ui">إرفاق الوسائط</span>.','لا تختر «بدون وسائط»، لأنها تحذف الصور والرسائل الصوتية.']},
      {h:'احفظ وارفع إلى دروب بوكس', li:['في قائمة المشاركة اضغط <span class="ui">حفظ في الملفات</span>، ثم «حفظ».','افتح رابط الرفع بالأسفل.','اضغط زر اختيار الملفات، واختر الملف المضغوط (zip) من «الملفات».','اكتب اسمك، ثم اضغط زر الرفع. انتظر حتى ينتهي.']}
    ],
    android:[
      {h:'افتح المجموعة', li:['افتح واتساب، ثم المجموعة.','اضغط <span class="ui">⋮</span> في الزاوية العليا.']},
      {h:'تصدير الدردشة', li:['اضغط <span class="ui">المزيد</span>.','اضغط <span class="ui">تصدير الدردشة</span>.']},
      {h:'تضمين الوسائط', li:['اضغط <span class="ui">تضمين الوسائط</span>.','لا تختر «بدون وسائط»، لأنها تحذف الصور والرسائل الصوتية.']},
      {h:'احفظ وارفع إلى دروب بوكس', li:['في قائمة المشاركة اختر الحفظ على الهاتف (الاسم يختلف حسب الهاتف: «الملفات» أو «حفظ»).','افتح رابط الرفع بالأسفل.','اضغط زر اختيار الملفات، واختر الملف المضغوط (zip).','اكتب اسمك، ثم اضغط زر الرفع. انتظر حتى ينتهي.']}
    ],
    svg:{group:'المجموعة', info:'معلومات المجموعة', exp:'تصدير الدردشة', attach:'إرفاق الوسائط', include:'تضمين الوسائط', without:'بدون وسائط', save:'حفظ في الملفات', more:'المزيد', upload:'رفع', drop:'دروب بوكس', media:'الوسائط', mute:'كتم', search:'بحث'}
  },
  en: {
    brand:'Marsh', brandSub:'Export a WhatsApp group', langBtn:'عربي',
    title:'Export a WhatsApp group with photos and voice notes',
    intro:'4 steps on your phone. An export from the phone carries the photos, videos and voice notes. WhatsApp Web does not.',
    groupsH:'Which groups?',
    g1:'Mariem’s group first.',
    g2:'Then each work group you want us to study from start to end. Export each group on its own.',
    groupsNote:'Work groups only. Do not send personal chats.',
    iphone:'iPhone', androidL:'Android',
    stepWord:'Step',
    copy:'Copy link', copied:'Copied', open:'Open the upload link',
    notesH:'Notes',
    n1:'A large group takes time to prepare. Keep WhatsApp open until the share menu shows.',
    n2:'If the group is very long, WhatsApp can leave out old media. If that happens, tell Labib.',
    n3:'If you do not see Export chat, the group privacy settings can block it. Tell Labib.',
    n4:'The file goes only to the Marsh folder in Dropbox. Nobody else gets it.',
    ios:[
      {h:'Open the group', li:['Open WhatsApp, then the group.','Tap the <span class="ui">group name</span> at the top.']},
      {h:'Export chat', li:['Scroll to the bottom.','Tap <span class="ui">Export Chat</span>.']},
      {h:'Attach media', li:['Tap <span class="ui">Attach Media</span>.','Do not pick "Without Media". It drops the photos and voice notes.']},
      {h:'Save and upload to Dropbox', li:['In the share menu, tap <span class="ui">Save to Files</span>, then "Save".','Open the upload link below.','Tap the choose-files button and pick the zip file from "Files".','Type your name, then tap the upload button. Wait until it ends.']}
    ],
    android:[
      {h:'Open the group', li:['Open WhatsApp, then the group.','Tap <span class="ui">⋮</span> in the top corner.']},
      {h:'Export chat', li:['Tap <span class="ui">More</span>.','Tap <span class="ui">Export chat</span>.']},
      {h:'Include media', li:['Tap <span class="ui">Include media</span>.','Do not pick "Without media". It drops the photos and voice notes.']},
      {h:'Save and upload to Dropbox', li:['In the share menu, save the file on the phone (the name depends on the phone: "Files" or "Save").','Open the upload link below.','Tap the choose-files button and pick the zip file.','Type your name, then tap the upload button. Wait until it ends.']}
    ],
    svg:{group:'Group', info:'Group info', exp:'Export Chat', attach:'Attach Media', include:'Include media', without:'Without Media', save:'Save to Files', more:'More', upload:'Upload', drop:'Dropbox', media:'Media', mute:'Mute', search:'Search'}
  }
};

var state = {lang:'ar', os:'ios'};
try { var s = localStorage.getItem('marsh-wa-lang'); if (s === 'en' || s === 'ar') state.lang = s; } catch(e) {}
try { var o = localStorage.getItem('marsh-wa-os'); if (o === 'ios' || o === 'android') state.os = o; } catch(e) {}

function esc(s){return String(s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];});}

/* Drawn phone screens. RED marks the thing to tap. */
function phone(os, n, L, rtl){
  var R='#E9212A', I='#141414', M='#9A9EA4', G='#E6E8E4', W='#FFFFFF';
  var x0 = rtl ? 150 : 30, anchor = rtl ? 'end' : 'start';
  var out = '<svg viewBox="0 0 180 340" style="direction:ltr" role="img" aria-label="'+esc(L.svgAlt)+'" xmlns="http://www.w3.org/2000/svg">';
  out += '<rect x="4" y="4" width="172" height="332" rx="26" fill="'+W+'" stroke="'+I+'" stroke-width="3"/>';
  out += '<rect x="66" y="12" width="48" height="8" rx="4" fill="'+I+'"/>';
  function t(x,y,s,o){o=o||{};return '<text x="'+x+'" y="'+y+'" font-size="'+(o.size||11)+'" font-weight="'+(o.w||500)+'" fill="'+(o.c||I)+'" text-anchor="'+(o.a||anchor)+'" font-family="IBM Plex Sans Arabic, system-ui, sans-serif">'+esc(s)+'</text>';}
  function bar(y,label,hot){
    var r = '<rect x="18" y="'+y+'" width="144" height="30" rx="8" fill="'+(hot?'#FDECEC':G)+'"'+(hot?' stroke="'+R+'" stroke-width="2.5"':'')+'/>';
    return r + t(x0, y+20, label, {c: hot?R:I, w: hot?700:500});
  }
  function finger(cx,cy){return '<circle cx="'+cx+'" cy="'+cy+'" r="11" fill="none" stroke="'+R+'" stroke-width="2.5"/><circle cx="'+cx+'" cy="'+cy+'" r="4" fill="'+R+'"/>';}
  if (n === 1) {
    // chat header + bubbles
    out += '<rect x="14" y="30" width="152" height="34" rx="10" fill="'+(os==='ios'?'#FDECEC':G)+'"'+(os==='ios'?' stroke="'+R+'" stroke-width="2.5"':'')+'/>';
    out += '<circle cx="'+(rtl?150:30)+'" cy="47" r="9" fill="'+M+'"/>';
    out += t(rtl?135:45, 51, L.group, {w:700, c: os==='ios'?R:I});
    if (os === 'android') {
      var dx = rtl ? 24 : 156;
      out += '<rect x="'+(dx-10)+'" y="35" width="20" height="24" rx="6" fill="#FDECEC" stroke="'+R+'" stroke-width="2.5"/>';
      out += '<circle cx="'+dx+'" cy="41" r="2" fill="'+R+'"/><circle cx="'+dx+'" cy="47" r="2" fill="'+R+'"/><circle cx="'+dx+'" cy="53" r="2" fill="'+R+'"/>';
      out += finger(dx, 76);
    } else {
      out += finger(90, 78);
    }
    var ys=[104,140,176,214,250];
    ys.forEach(function(y,i){var left=(i%2===0); var w=[96,70,110,84,60][i];
      var bx = left ? 18 : 162-w; out += '<rect x="'+bx+'" y="'+y+'" width="'+w+'" height="26" rx="10" fill="'+(left?G:'#DFF3E4')+'"/>';});
    out += '<rect x="18" y="296" width="144" height="26" rx="13" fill="'+G+'"/>';
  } else if (n === 2) {
    if (os === 'ios') {
      out += t(90, 48, L.info, {a:'middle', w:700});
      out += bar(64, L.media); out += bar(100, L.mute); out += bar(136, L.search);
      out += '<path d="M90 176 v26 m-8 -10 l8 10 l8 -10" stroke="'+M+'" stroke-width="2.5" fill="none"/>';
      out += bar(220, L.exp, true);
      out += finger(rtl?40:140, 236);
    } else {
      out += '<rect x="40" y="34" width="126" height="150" rx="10" fill="'+W+'" stroke="'+G+'" stroke-width="2"/>';
      out += bar(44, L.media); out += bar(80, L.search);
      out += bar(116, L.more, true);
      out += '<rect x="26" y="168" width="140" height="80" rx="10" fill="'+W+'" stroke="'+I+'" stroke-width="2"/>';
      out += bar(182, L.exp, true);
      out += finger(rtl?40:140, 198);
    }
  } else if (n === 3) {
    out += '<rect x="0" y="0" width="180" height="340" rx="26" fill="rgba(20,20,20,.18)"/>';
    out += '<rect x="14" y="196" width="152" height="122" rx="14" fill="'+W+'" stroke="'+I+'" stroke-width="2"/>';
    out += t(90, 220, L.exp, {a:'middle', w:700});
    out += bar(232, os==='ios'?L.attach:L.include, true);
    out += bar(272, L.without);
    out += finger(rtl?40:140, 248);
  } else {
    // share sheet → save, then dropbox upload
    out += '<rect x="14" y="30" width="152" height="120" rx="14" fill="'+G+'"/>';
    out += '<rect x="'+(rtl?122:24)+'" y="42" width="34" height="40" rx="6" fill="'+W+'" stroke="'+I+'" stroke-width="2"/>';
    out += t(rtl?112:66, 60, 'zip', {w:700});
    out += bar(98, L.save, true);
    out += finger(rtl?40:140, 114);
    out += '<path d="M90 160 v22 m-8 -10 l8 10 l8 -10" stroke="'+M+'" stroke-width="2.5" fill="none"/>';
    out += '<rect x="14" y="194" width="152" height="126" rx="14" fill="'+W+'" stroke="'+I+'" stroke-width="2"/>';
    out += '<path d="M78 214 l8 5 l-8 5 l-8 -5 z M94 214 l8 5 l-8 5 l-8 -5 z M78 226 l8 5 l-8 5 l-8 -5 z M94 226 l8 5 l-8 5 l-8 -5 z" fill="#0061FE"/>';
    out += t(90, 256, L.drop, {a:'middle', w:700});
    out += '<rect x="40" y="270" width="100" height="32" rx="16" fill="'+R+'"/>';
    out += t(90, 291, L.upload, {a:'middle', w:700, c:W});
    out += finger(rtl?52:128, 286);
  }
  out += '</svg>';
  return out;
}

function render(){
  var L = T[state.lang], rtl = state.lang === 'ar';
  document.documentElement.lang = state.lang;
  document.documentElement.dir = rtl ? 'rtl' : 'ltr';
  document.title = (rtl ? 'مارش · ' : 'Marsh · ') + L.brandSub;
  document.querySelectorAll('[data-t]').forEach(function(el){ var k = el.getAttribute('data-t'); if (L[k] != null) el.textContent = L[k]; });
  document.getElementById('lang').textContent = L.langBtn;
  document.getElementById('lang').setAttribute('aria-label', rtl ? 'Switch to English' : 'التبديل إلى العربية');
  document.querySelectorAll('.tab').forEach(function(b){ b.setAttribute('aria-selected', String(b.getAttribute('data-os') === state.os)); });
  var steps = L[state.os], html = '';
  var svgL = Object.assign({}, L.svg);
  steps.forEach(function(st, i){
    var n = i + 1;
    svgL.svgAlt = L.stepWord + ' ' + n + ': ' + st.h;
    html += '<section class="card step" aria-labelledby="s'+n+'">';
    html += '<div class="step-head"><div class="num">'+n+'</div><h2 id="s'+n+'">'+esc(st.h)+'</h2></div>';
    html += '<div class="fig">'+phone(state.os, n, svgL, rtl)+'</div>';
    html += '<ol>' + st.li.map(function(x){return '<li>'+x+'</li>';}).join('') + '</ol>';
    if (n === 4) {
      html += '<div class="link-box"><code id="req">'+esc(URL_REQ)+'</code><div class="row">'
        + '<a class="btn btn-red" href="'+esc(URL_REQ)+'" target="_blank" rel="noopener">'+esc(L.open)+'</a>'
        + '<button class="btn btn-line" type="button" id="copy">'+esc(L.copy)+'</button></div></div>';
    }
    html += '</section>';
  });
  document.getElementById('steps').innerHTML = html;
  var c = document.getElementById('copy');
  if (c) c.addEventListener('click', function(){
    var done = function(){ c.textContent = L.copied; setTimeout(function(){ c.textContent = L.copy; }, 1800); };
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(URL_REQ).then(done, function(){ selectReq(); });
    } else { selectReq(); }
  });
}
function selectReq(){ var r = document.createRange(); r.selectNodeContents(document.getElementById('req')); var s = window.getSelection(); s.removeAllRanges(); s.addRange(r); }

document.getElementById('lang').addEventListener('click', function(){
  state.lang = state.lang === 'ar' ? 'en' : 'ar';
  try { localStorage.setItem('marsh-wa-lang', state.lang); } catch(e) {}
  render();
});
document.querySelectorAll('.tab').forEach(function(b){
  b.addEventListener('click', function(){
    state.os = b.getAttribute('data-os');
    try { localStorage.setItem('marsh-wa-os', state.os); } catch(e) {}
    render();
  });
});
var q = new URLSearchParams(location.search);
if (q.get('lang') === 'en' || q.get('lang') === 'ar') state.lang = q.get('lang');
if (q.get('os') === 'android' || q.get('os') === 'ios') state.os = q.get('os');
render();
</script>
</body>
</html>
